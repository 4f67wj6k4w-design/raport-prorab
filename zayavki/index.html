<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Заявки на вывоз</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: узкая колонка для прораба, широкая двухколоночная сетка для диспетчера и директора. Палитра взята из прототипа: тёмно-зелёный, тёплый светлый фон. */
:root{
  --bg:#f3f2ec; --card:#ffffff; --fg:#1d2118; --muted:#6a705f; --line:#dad9cd; --soft:#ebeae0;
  --accent:#2d6a1f; --accent-fg:#ffffff; --accent-soft:#e0edd7;
  --warn:#9c4a14; --warn-soft:#f8e5d6; --bad:#a32a38; --bad-soft:#f6dcdf; --info:#2a5b86; --info-soft:#dde9f4;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14170f; --card:#1d2117; --fg:#e8eadf; --muted:#9aa18c; --line:#32382a; --soft:#262b1e;
  --accent:#6fb85a; --accent-fg:#0f1a0b; --accent-soft:#25371d;
  --warn:#e5a06b; --warn-soft:#3a2818; --bad:#ec8591; --bad-soft:#3d1d22; --info:#8fbbe6; --info-soft:#1b2f43; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14170f; --card:#1d2117; --fg:#e8eadf; --muted:#9aa18c; --line:#32382a; --soft:#262b1e;
  --accent:#6fb85a; --accent-fg:#0f1a0b; --accent-soft:#25371d;
  --warn:#e5a06b; --warn-soft:#3a2818; --bad:#ec8591; --bad-soft:#3d1d22; --info:#8fbbe6; --info-soft:#1b2f43; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:17px;line-height:1.15}.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.who{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.new{background:var(--warn-soft);color:var(--warn)}.pill.part{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--accent);color:var(--accent-fg)}.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.narrow{max-width:460px;margin:0 auto}
h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
.item .row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin-top:8px}
.item .row>*{min-width:0}
.itemhead{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.req{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--card)}
.reqhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.reqhead b{min-width:0;overflow-wrap:anywhere}
.line{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.line .assign{color:var(--accent);font-size:13px;overflow-wrap:anywhere}
.line .assign.none{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}.fline{font-size:13px;color:var(--info);margin:-2px 0 6px}.frow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1fr) 62px 62px 74px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.frow input{width:100%}.fhead{font-size:12px;color:var(--muted);border-top:0}@media (max-width:700px){.frow{grid-template-columns:1fr 1fr}.fhead{display:none}}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}.daynav input{font:inherit}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);display:block}.kpi b{font-size:24px;font-family:var(--mono);display:block;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.days .chip{flex:none}
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.veh{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:5px 8px;background:var(--card);font-size:12px;text-align:left;cursor:pointer;min-width:0}
.veh b{display:block;font-size:13px}.veh span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.veh.used{border-left-color:var(--accent);background:var(--accent-soft)}
.veh.repair{border-left-color:var(--bad);background:var(--bad-soft)}
.veh.sel{outline:2px solid var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
.veh.busy{opacity:.45;cursor:not-allowed}
.modalbg{position:fixed;inset:0;background:rgba(10,14,8,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.approve{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.approve.stale{background:var(--warn-soft);border-color:var(--warn)}
.bars .b{display:grid;grid-template-columns:minmax(0,150px) 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .t{height:14px;background:var(--soft);border-radius:7px;overflow:hidden;display:flex}
.bars .t i{display:block;height:100%}
.bars .n{overflow-wrap:anywhere}
.trend{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0;text-align:center;font-size:11px;color:var(--muted)}
.trend .stack{display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.trend .stack i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-own{background:var(--accent)}.c-hire{background:var(--info)}.c-need{background:var(--warn)}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:10px}
.tag{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .grid2,.cols2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line{grid-template-columns:minmax(0,1fr) auto}
  .line .assign{grid-column:1/-1;order:3}
  .who{margin-left:0;width:100%}
  .who select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>body{margin:0}</style></head><body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">КМ</div><div><b>Заявки на вывоз</b><span id="subline">тестовая версия · данные общие для всех</span></div></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="who"><span>Вы вошли как</span><b id="who"></b></div>
  </header>
  <div id="main"></div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>document.write('<script src="config.js?'+Date.now()+'"><\/script>')</script>
<script>
(function(){
"use strict";
var S={foremen:[],objects:[],carriers:[],fleet:[],staff:[],requests:[],approvals:[],drivers:[],routes:[],places:[]};
var ready={};
var st={tab:'foreman',who:null,day:null,dirDay:null,draft:null,draftForeman:null,modal:null,pending:null,loaded:false};
var MATERIALS=['Грунт','Замусоренный грунт','Кирпичный бой','Ж/Б бой','Бетон','Строительный мусор','Несортированный мусор','Деревянные отходы','Пескогрунт','Песок','Асфальт','Металлолом','Другое'];
var DESTS=['На усмотрение диспетчера','МЭР Подольск','Рябиновая','КПТС','По месту'];
var TYPES={vyvoz:'Вывоз',mesto:'По месту',samo:'Самовывоз',polivo:'Поливомоечная'};
var TYPE_HINT={vyvoz:'Самосвалы вывозят материал с объекта',mesto:'Перевозка внутри объекта или рядом',samo:'Материал забирает перевозчик',polivo:'Уборка и мойка дороги'};

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function short(k){var d=parseKey(k);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+WD[d.getDay()]}
function today(){return dkey(new Date())}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function nowStr(){var d=new Date();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' в '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toast(t){var h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';setTimeout(function(){h.innerHTML=''},2600)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function sortBy(list,f){return list.slice().sort(function(a,b){var x=f(a),y=f(b);return x<y?-1:x>y?1:0})}

/* ---------- people ---------- */
var ME=null;
function me(){return ME}
function isStaff(m){return m&&(m.kind==='dispatcher'||m.kind==='approver'||m.kind==='admin')}
function canAssign(m){return m&&(m.kind==='dispatcher'||m.kind==='admin')}
function canApprove(m){return m&&(m.kind==='approver'||m.kind==='admin')}
var ROLE_NAMES={foreman:'прораб',dispatcher:'диспетчер',approver:'коммерческий директор',director:'генеральный директор',admin:'администратор'};
function tabsFor(m){
  if(!m)return [];
  if(m.kind==='foreman')return [['foreman','Заявка']];
  if(m.kind==='dispatcher')return [['dispatcher','Диспетчер'],['foreman','Новая заявка'],['admin','Справочники']];
  if(m.kind==='approver')return [['dispatcher','Расстановка'],['director','Дашборд'],['svodka','Сводка']];
  if(m.kind==='director')return [['director','Дашборд'],['svodka','Сводка']];
  return [['dispatcher','Диспетчер'],['foreman','Новая заявка'],['director','Дашборд'],['svodka','Сводка'],['admin','Справочники']];
}
/* ---------- fleet & demand ---------- */
function ownSam(){return S.fleet.filter(function(v){return v.kind==='sam'})}
function ownPmm(){return S.fleet.filter(function(v){return v.kind==='pmm'})}
function needOf(it){
  if(it.type==='polivo')return 1;
  if(it.type==='samo')return 0;
  if(it.allOwn)return ownSam().filter(function(v){return v.status!=='repair'}).length;
  return +it.count||0;
}
function assignedCount(it){
  var a=it.assigned||{};var n=(a.own||[]).length;(a.hired||[]).forEach(function(h){n+=(+h.count||0)});return n;
}
function itemDone(it){
  if(it.type==='samo')return !!(it.assigned&&it.assigned.agreed);
  var need=needOf(it);return need>0&&assignedCount(it)>=need;
}
function itemTouched(it){var a=it.assigned;if(!a)return false;return (a.own&&a.own.length)||(a.hired&&a.hired.length)||a.agreed}
function reqStatus(r){
  var its=r.items||[];if(!its.length)return 'new';
  var d=its.filter(itemDone).length;
  if(d===its.length)return 'done';
  if(its.some(itemTouched))return 'part';
  return 'new';
}
function statusPill(s){return s==='done'?'<span class="pill done">Назначена</span>':s==='part'?'<span class="pill part">Частично</span>':'<span class="pill new">Новая</span>'}
function itemTitle(it){
  var t=TYPES[it.type]+': ';
  if(it.type==='polivo')return t+(it.note||'Поливомоечная');
  t+=it.material||'—';
  if(it.type==='samo'){if(it.volume)t+=' · '+it.volume+(/\D/.test(it.volume)?'':' м³');if(+it.count)t+=' · '+it.count+' маш.';return t}
  if(it.allOwn)t+=' · все свои Renault';else t+=' · '+(+it.count||0)+' маш.';
  if(it.type==='vyvoz'&&it.dest&&it.dest!=='На усмотрение диспетчера')t+=' → '+it.dest;
  return t;
}
function assignText(it){
  var a=it.assigned||{};var p=[];
  if(a.agreed)p.push('согласовано · '+a.agreed);
  if(a.own&&a.own.length){p.push('свои '+a.own.map(function(id){var v=byId(S.fleet,id);return v?v.name:id}).join(', '))}
  (a.hired||[]).forEach(function(h){p.push(h.carrier+' × '+h.count)});
  return p.join(' · ');
}
function dayRequests(day){return S.requests.filter(function(r){return r.date===day})}
function usedBy(day,exceptItem){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(it.id===exceptItem)return;
    ((it.assigned||{}).own||[]).forEach(function(id){m[id]={obj:objName(r.object),short:objShort(r.object)}});
  })});
  return m;
}
function objName(code){var o=byId(S.objects,code);return o?o.name:code}
function objShort(code){var o=byId(S.objects,code);return o?(o.short||o.name):code}
function dayStats(day){
  var need=0,own=0,hired=0,missing=0;
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(it.type!=='samo')need+=needOf(it);
    var a=it.assigned||{};own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){hired+=(+h.count||0)});
    if(!itemDone(it))missing++;
  })});
  var fv=dayFact(day);
  return {need:need,own:own,hired:hired,missing:missing,factVol:fv.vol};
}
function approval(day){return byId(S.approvals,day)}


/* ---------- факт вывоза ---------- */
var KINDS=['Рейсы','По месту','Простой','Ремонт/ТО','Без водителя'];
var ROUTE_K=2.2;
function num(x){x=parseFloat(String(x).replace(',','.'));return isFinite(x)?x:0}
function r1(x){return Math.round(x*100)/100}
function factOf(it){return it.fact||null}
function factTotals(it){
  var f=it.fact;if(!f)return {own:0,hired:0,vol:0,trips:0,km:0};
  var own=0,hired=0,trips=0;
  (f.own||[]).forEach(function(o){own+=num(o.vol);if(o.kind==='Рейсы'||!o.kind)trips+=num(o.trips)});
  (f.hired||[]).forEach(function(h){hired+=num(h.vol);trips+=0});
  return {own:own,hired:hired,vol:own+hired,trips:trips,km:num(f.km)*trips*ROUTE_K,ownTrips:trips};
}
function dayFact(day){
  var vol=0,own=0,hired=0,trips=0,km=0;
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){var t=factTotals(it);vol+=t.vol;own+=t.own;hired+=t.hired;trips+=t.trips;km+=t.km})});
  return {vol:vol,own:own,hired:hired,trips:trips,km:km};
}
function placesFor(){return sortBy((S.places||[]),function(p){return p.type+p.name})}
function objDName(code){var o=byId(S.objects,code);return o&&o.dname?o.dname:''}
function findRoute(objCode,dest){
  var d=objDName(objCode);if(!d||!dest)return null;
  var list=S.routes||[];for(var i=0;i<list.length;i++)if(list[i].from===d&&list[i].to===dest)return list[i];
  return null;
}
function mapDest(txt){
  var t=String(txt||'');var pl=S.places||[];
  var key=/МЭР/i.test(t)?'МЭР':/Рябинов/i.test(t)?'Рябинов':/КПТС/i.test(t)?'КПТС':'';
  if(!key)return '';
  for(var i=0;i<pl.length;i++)if(pl[i].name.indexOf(key)>=0)return pl[i].name;
  return '';
}
function factLine(it){
  var f=it.fact;if(!f)return '';
  var t=factTotals(it);
  var p=['вывезено '+r1(t.vol)+' м³'];
  if(t.own)p.push('Рено '+r1(t.own)+' м³');
  if(t.hired)p.push('перевозчики '+r1(t.hired)+' м³');
  if(t.trips)p.push(t.trips+' рейс.');
  if(f.dest)p.push('→ '+f.dest.replace(/^Полигон /,''));
  if(f.km)p.push(f.km+' км');
  return '<div class="fline">'+esc(p.join(' · '))+'</div>';
}
function openFact(rid,iid){
  var r=byId(S.requests,rid);if(!r)return;
  var it=(r.items||[]).filter(function(x){return x.id===iid})[0];if(!it)return;
  var f=it.fact?clone(it.fact):null;var a=it.assigned||{};

/* ---------- обмен с сервером ---------- */
var TOKEN=(new URLSearchParams(location.search)).get('t')||'';
var VER=null, inflight=0;
function api(body){
  body.t=TOKEN;
  return fetch(window.ZV_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function localApply(kind,coll,id,data){
  var list=S[coll];var i=-1;for(var k=0;k<list.length;k++)if(list[k].id===id){i=k;break}
  if(kind==='delete'){if(i>=0)list.splice(i,1)}
  else if(kind==='update'){if(i>=0)for(var f in data)list[i][f]=data[f]}
  else{var x=JSON.parse(JSON.stringify(data));x.id=id;if(i>=0)list[i]=x;else list.push(x)}
  afterData();
}
function write(kind,coll,id,data){
  localApply(kind,coll,id,data||{});
  inflight++;
  return api({op:'w',kind:kind,coll:coll,id:id,data:data||null}).then(function(r){
    inflight--;
    if(!r||!r.ok){var e=new Error(r&&r.error||'нет связи');refresh(true);throw e}
    VER=r.ver;return r;
  },function(err){inflight--;refresh(true);throw err});
}
function put(coll,id,data){return write('set',coll,id,data).catch(fail)}
function upd(coll,id,data){return write('update',coll,id,data).catch(fail)}
function del(coll,id){return write('delete',coll,id).catch(fail)}
function fail(e){toast('Не удалось сохранить: '+(e&&e.message||e));throw e}
function newId(){return 'z'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function logLine(r,text){var m=me();var l=(r.log||[]).slice(-9);l.push({t:nowStr(),who:m?m.name:'?',text:text});return l}
function saveItems(r,items,text){

function winDays(off){var t=new Date(),out=[];for(var i=-6;i<=7;i++)out.push(dkey(addDays(t,off+i)));return out}
function offFor(day){return Math.round((parseKey(day)-parseKey(today()))/86400000)}
function dispDays_old(){
  var out=[],t=new Date();
  for(var i=0;i<=7;i++)out.push(dkey(addDays(t,i)));
  return out;
}
function renderDispatcher(){
  var el=$('#main');if(!st.loaded){el.innerHTML='<div class="empty">Загружаю…</div>';return}

  if(!st.day)st.day=dkey(addDays(new Date(),1));

  if(days.indexOf(st.day)<0){st.dispOff=offFor(st.day);days=winDays(st.dispOff)}

function approveBar(day,reqs,m){

  }else{
    h='<div class="approve stale"><div><b>Ждёт утверждения</b><div class="small muted">'+(ok?'Все позиции закрыты машинами.':'Есть позиции без машин.')+' Утверждает Фоминых В.В.</div></div>'+(canApprove(m)?'<button class="btn pri sm" data-act="approve">Утвердить расстановку</button>':'')+'</div>';

function saveAssign(clear){

/* ----- texts for MAX ----- */
function reqText(r){
  var t=objName(r.object)+' · '+short(r.date)+'\nПрораб: '+(r.foremanName||'')+'\n';
  (r.items||[]).forEach(function(it){t+='- '+itemTitle(it)+(itemTouched(it)?' → '+assignText(it):' → машины не назначены')+(it.assigned&&it.assigned.note?' ('+it.assigned.note+')':'')+'\n'});
  if(r.comment)t+='Комментарий: '+r.comment+'\n';
  return t.trim();
}
function dayText(day){
  var t='Разнарядка на '+short(day)+'\n';
  var own=[],hired=[],agreed=[];
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    var a=it.assigned||{};var what=objShort(r.object)+': '+itemTitle(it).replace(/ · все свои Renault/,'').replace(/ · \d+ маш\./,'');
    (a.own||[]).forEach(function(id){var v=byId(S.fleet,id);own.push((v?(v.model?v.model+' ':'')+v.name:id)+' — '+what+(a.note?' ('+a.note+')':''))});
    (a.hired||[]).forEach(function(h){hired.push(h.carrier+' × '+h.count+' — '+what+(a.note?' ('+a.note+')':''))});
    if(a.agreed)agreed.push(a.agreed+' — '+what);
  })});
  if(own.length)t+='\nСвои машины:\n'+own.join('\n')+'\n';
  if(hired.length)t+='\nНаёмные:\n'+hired.join('\n')+'\n';
  if(agreed.length)t+='\nСамовывоз согласован:\n'+agreed.join('\n')+'\n';
  if(!own.length&&!hired.length&&!agreed.length)t+='\nНазначений пока нет.\n';

}

}

  h+='<div class="cols2"><div class="card"><h3>Машины по дням</h3><div class="legend"><span><i class="c-own"></i>свои</span><span><i class="c-hire"></i>наёмные</span><span><i class="c-need"></i>не закрыто</span></div>'+trendHtml(days.slice(5,13),day)+'</div>';

function factTable(day){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(!it.fact)return;var t=factTotals(it);var k=r.object;
    var x=m[k]||(m[k]={name:objShort(k),own:0,hired:0,trips:0,km:0});
    x.own+=t.own;x.hired+=t.hired;x.trips+=t.trips;x.km+=t.km;
  })});
  var rows=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return (b.own+b.hired)-(a.own+a.hired)});
  if(!rows.length)return '<div class="empty">Факт за этот день ещё не внесён диспетчерами.</div>';
  var T={own:0,hired:0,trips:0,km:0};
  var body=rows.map(function(x){T.own+=x.own;T.hired+=x.hired;T.trips+=x.trips;T.km+=x.km;return '<tr><td>'+esc(x.name)+'</td><td class="num">'+r1(x.own)+'</td><td class="num">'+r1(x.hired)+'</td><td class="num"><b>'+r1(x.own+x.hired)+'</b></td><td class="num">'+x.trips+'</td><td class="num">'+Math.round(x.km)+'</td></tr>'}).join('');
  body+='<tr><td><b>Итого</b></td><td class="num"><b>'+r1(T.own)+'</b></td><td class="num"><b>'+r1(T.hired)+'</b></td><td class="num"><b>'+r1(T.own+T.hired)+'</b></td><td class="num"><b>'+T.trips+'</b></td><td class="num"><b>'+Math.round(T.km)+'</b></td></tr>';
  return '<div class="table"><table><thead><tr><th>Объект</th><th>Рено, м³</th><th>Перевозчики, м³</th><th>Всего, м³</th><th>Рейсов Рено</th><th>Пробег, км</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function trendHtml(ds,sel){
  var data=ds.map(function(k){var s=dayStats(k);return {k:k,own:s.own,hired:s.hired,gap:Math.max(0,s.need-s.own-s.hired)}});
  var max=Math.max.apply(null,data.map(function(x){return x.own+x.hired+x.gap}).concat([1]));
  return '<div class="trend">'+data.map(function(x){
    var tot=x.own+x.hired+x.gap;
    return '<div class="col" title="'+short(x.k)+': свои '+x.own+', наёмные '+x.hired+', не закрыто '+x.gap+'"><span class="num" style="color:var(--fg)">'+(tot||'')+'</span><div class="stack"><i class="c-need" style="height:'+(x.gap/max*100)+'%"></i><i class="c-hire" style="height:'+(x.hired/max*100)+'%"></i><i class="c-own" style="height:'+(x.own/max*100)+'%"></i></div><span style="'+(x.k===sel?'color:var(--fg);font-weight:600':'')+'">'+short(x.k).slice(0,5)+'</span></div>';
  }).join('')+'</div>';
}
function barsHtml(rows,unit){
  if(!rows.length)return '<div class="empty">За этот день данных нет.</div>';
  var max=Math.max.apply(null,rows.map(function(r){return r.own+r.hired}).concat([1]));
  return '<div class="bars">'+rows.map(function(r){return '<div class="b"><span class="n">'+esc(r.name)+'</span><div class="t"><i class="c-own" style="width:'+(r.own/max*100)+'%"></i><i class="c-hire" style="width:'+(r.hired/max*100)+'%"></i></div><span class="num">'+(r.own+r.hired)+'</span></div>'}).join('')+'</div>';
}
function objBars(day){
  var m={};
  dayRequests(day).forEach(function(r){var k=objShort(r.object);m[k]=m[k]||{name:k,own:0,hired:0};(r.items||[]).forEach(function(it){var a=it.assigned||{};m[k].own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){m[k].hired+=(+h.count||0)})})});
  var rows=Object.keys(m).map(function(k){return m[k]}).filter(function(x){return x.own+x.hired>0}).sort(function(a,b){return b.own+b.hired-a.own-a.hired});
  return barsHtml(rows);
}
function carrierBars(day){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){var a=it.assigned||{};
    (a.hired||[]).forEach(function(h){m[h.carrier]=(m[h.carrier]||0)+(+h.count||0)});
    if(a.agreed&&a.agreed!=='перенос из Excel')m[a.agreed]=(m[a.agreed]||0)+(+it.count||0)})});
  var rows=Object.keys(m).map(function(k){return {name:k,own:0,hired:m[k]}}).sort(function(a,b){return b.hired-a.hired});
  return barsHtml(rows);
}
function materialBars(day){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){if(it.type==='polivo')return;var k=it.material||'—';m[k]=m[k]||{name:k,own:0,hired:0};var a=it.assigned||{};m[k].own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){m[k].hired+=(+h.count||0)})})});
  var rows=Object.keys(m).map(function(k){return m[k]}).filter(function(x){return x.own+x.hired>0}).sort(function(a,b){return b.own+b.hired-a.own-a.hired});
  return barsHtml(rows);
}
function fleetTable(day){
  if(!S.fleet.length)return '<div class="empty">Парк не заполнен.</div>';
  var used=usedBy(day);
  var rows=sortBy(S.fleet,function(v){return v.order||0}).map(function(v){
    var u=used[v.id];var s=v.status==='repair'?'<span class="pill bad">ремонт</span>':u?'<span class="pill ok">в работе</span>':'<span class="pill" style="background:var(--soft);color:var(--muted)">свободна</span>';
    var hist=0;for(var i=-6;i<=0;i++){if(usedBy(dkey(addDays(new Date(),i)))[v.id])hist++}
    return '<tr><td><b>'+esc((v.model?v.model+' ':'')+v.name)+'</b></td><td>'+s+'</td><td>'+(u?esc(u.obj):'')+'</td><td class="num">'+hist+' из 7</td></tr>';
  }).join('');
  return '<div class="table"><table><thead><tr><th>Машина</th><th>Статус</th><th>Объект</th><th>Дней в работе за неделю</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function slug(s){var m={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ы:'y',э:'e',ю:'yu',я:'ya'};
  return String(s).toLowerCase().split('').map(function(c){return m[c]!==undefined?m[c]:/[a-z0-9]/.test(c)?c:'-'}).join('').replace(/-+/g,'-').replace(/^-|-$/g,'')||'x'}


/* ---------- сводка за период ---------- */
var PERIODS=[['7','7 дней'],['30','30 дней'],['year','С начала года'],['all','Всё время'],['custom','Свой период']];
function perRange(){
  var t=new Date(),k=st.per||'30';var to=today(),from;
  if(k==='7')from=dkey(addDays(t,-6));
  else if(k==='30')from=dkey(addDays(t,-29));
  else if(k==='year')from=t.getFullYear()+'-01-01';
  else if(k==='custom'){from=st.perFrom||dkey(addDays(t,-29));to=st.perTo||to}
  else{from='0000-00-00';to='9999-99-99'}
  var prev=null;
  if(k!=='all'){var a=parseKey(from),b=parseKey(to);var n=Math.round((b-a)/86400000)+1;prev={from:dkey(addDays(a,-n)),to:dkey(addDays(a,-1))}}
  return {from:from,to:to,prev:prev};
}
function aggr(from,to){
  var A={own:0,hired:0,trips:0,km:0,hours:0,work:0,repair:0,nodrv:0,days:{},obj:{},car:{},truck:{},drv:{}};
  var tday={};
  S.requests.forEach(function(r){
    if(r.date<from||r.date>to)return;
    (r.items||[]).forEach(function(it){
      var f=it.fact;if(!f)return;A.days[r.date]=1;
      var ob=A.obj[r.object]||(A.obj[r.object]={own:0,hired:0,trips:0,km:0});
      (f.own||[]).forEach(function(o){
        var v=num(o.vol),tr=(o.kind==='Рейсы'||!o.kind)?num(o.trips):0,km=num(f.km)*tr*ROUTE_K;
        A.own+=v;A.trips+=tr;A.km+=km;A.hours+=num(o.hours);ob.own+=v;ob.trips+=tr;ob.km+=km;
        var tk=A.truck[o.id]||(A.truck[o.id]={vol:0,trips:0,km:0,work:0,repair:0,nodrv:0});
        tk.vol+=v;tk.trips+=tr;tk.km+=km;
        var st0=(o.kind==='Ремонт/ТО')?'repair':(o.kind==='Без водителя')?'nodrv':'work';
        var key=o.id+'|'+r.date,prevS=tday[key];
        var rank={work:3,repair:2,nodrv:1};
        if(!prevS||rank[st0]>rank[prevS.s])tday[key]={s:st0,id:o.id};
        if(o.driver){var dv=A.drv[o.driver]||(A.drv[o.driver]={vol:0,trips:0,days:{}});dv.vol+=v;dv.trips+=tr;dv.days[r.date]=1}
      });
      (f.hired||[]).forEach(function(h){
        var v=num(h.vol);A.hired+=v;ob.hired+=v;var cn=h.carrier||'(без перевозчика: экология, бесплатный вывоз, реализация)';
        var c=A.car[cn]||(A.car[cn]={vol:0});c.vol+=v;
      });
    });
  });
  Object.keys(tday).forEach(function(k){var x=tday[k];A[x.s]++;A.truck[x.id][x.s]++});
  return A;
}
function fmt(x,d){return (Math.round(x*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('ru-RU',{maximumFractionDigits:d||0})}
function deltaHtml(cur,prev,has){
  if(!has)return '<small class="muted">нет данных для сравнения</small>';
  if(!prev)return '<small class="muted">в прошлом периоде: 0</small>';
  var p=(cur-prev)/prev*100;var cl=p>=0?'ok':'bad';
  return '<small style="color:var(--'+(p>=0?'accent':'bad')+')">'+(p>=0?'▲ +':'▼ ')+fmt(p,0)+'% к прошлому периоду ('+fmt(prev,0)+')</small>';
}
function svodTable(head,rows){
  if(!rows.length)return '<div class="empty">За период данных нет.</div>';
  return '<div class="table"><table><thead><tr>'+head.map(function(h,i){return '<th'+(i?' class="num"':'')+'>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i?' class="num"':'')+'>'+(i?c:esc(c))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}

  h+='<div class="kpis">'
   +'<div class="kpi"><span>Вывезено всего, м³</span><b>'+fmt(tot)+'</b><br>'+deltaHtml(tot,ptot,hp)+'</div>'

   +'<div class="kpi"><span>Рейсов Рено</span><b>'+fmt(A.trips)+'</b><br>'+deltaHtml(A.trips,P&&P.trips,hp)+'</div>'
   +'<div class="kpi"><span>Пробег Рено, км</span><b>'+fmt(A.km)+'</b><br>'+deltaHtml(A.km,P&&P.km,hp)+'</div>'
   +'<div class="kpi"><span>Рено в работе, % машино-дней</span><b>'+fmt(ktg,1)+'%</b><br>'+(hp?'<small class="muted">в прошлом периоде: '+fmt(pktg,1)+'%</small>':'')+'</div>'
   +'<div class="kpi"><span>Машино-дней в работе</span><b>'+fmt(A.work)+'</b><br><small class="muted">ремонт/ТО: '+fmt(A.repair)+' · без водителя: '+fmt(A.nodrv)+'</small></div>'
   +'</div>';
  var objRows=Object.keys(A.obj).map(function(k){var x=A.obj[k];return {k:k,x:x,t:x.own+x.hired}}).sort(function(a,b){return b.t-a.t}).map(function(o){return [objShort(o.k),fmt(o.x.own),fmt(o.x.hired),'<b>'+fmt(o.t)+'</b>',fmt(o.x.trips),fmt(o.x.km)]});
  h+='<div class="card" style="margin-top:16px"><h3>По объектам</h3>'+svodTable(['Объект','Рено, м³','Перевозчики, м³','Всего, м³','Рейсов Рено','Пробег, км'],objRows)+'</div>';
  var carRows=Object.keys(A.car).map(function(k){return [k,A.car[k].vol]}).sort(function(a,b){return b[1]-a[1]}).map(function(x){return [x[0],fmt(x[1]),fmt(tot?x[1]/tot*100:0,1)+'%']});

  var trRows=Object.keys(A.truck).map(function(k){var v=byId(S.fleet,k);return {k:k,v:v,x:A.truck[k]}}).sort(function(a,b){return b.x.vol-a.x.vol}).map(function(o){var d=o.x.work+o.x.repair+o.x.nodrv;return [(o.v?o.v.name:o.k)+(o.v&&o.v.bort?' (борт '+o.v.bort+')':''),fmt(o.x.vol),fmt(o.x.trips),fmt(o.x.km),fmt(o.x.work),fmt(o.x.repair),fmt(o.x.nodrv),fmt(d?o.x.work/d*100:0)+'%']});

  var dvRows=Object.keys(A.drv).map(function(k){return [k,A.drv[k]]}).sort(function(a,b){return b[1].vol-a[1].vol}).map(function(o){return [o[0],fmt(o[1].vol),fmt(o[1].trips),fmt(Object.keys(o[1].days).length)]});
  h+='<div class="card" style="margin-top:16px"><h3>По водителям</h3>'+svodTable(['Водитель','Вывезено, м³','Рейсов','Выходов'],dvRows)+'</div>';

function appendImport(){
  var h='<div class="card" style="margin-top:16px"><h3>Перенос данных из Excel</h3><div class="small muted" style="margin-bottom:8px">Выберите файл переноса (import.json). Загрузка безопасна: если запустить повторно, записи не задвоятся.</div><input type="file" id="impFile" accept=".json,application/json"> <button class="btn" data-act="impGo">Загрузить</button><div id="impLog" class="small" style="margin-top8px;margin-top:8px"></div></div>';
  $('#main').insertAdjacentHTML('beforeend',h);
}
function impLog(t){var e=$('#impLog');if(e)e.textContent=t}
function runImport(){
  var f=$('#impFile')&&$('#impFile').files[0];if(!f){toast('Сначала выберите файл');return}
  var rd=new FileReader();
  rd.onload=function(){
    var J;try{J=JSON.parse(rd.result)}catch(e){impLog('Файл не читается');return}
    var docs=[];
    (J.objects||[]).forEach(function(o){if(!byId(S.objects,o.id))docs.push({coll:'objects',id:o.id,data:o})});
    (J.carriers||[]).forEach(function(n){var id=slug(n);if(!S.carriers.some(function(c){return c.name===n}))docs.push({coll:'carriers',id:id,data:{name:n}})});
    (J.requests||[]).forEach(function(r){docs.push({coll:'requests',id:r.id,data:r})});
    var total=docs.length,done=0,CH=20;
    impLog('Загружаю: 0 из '+total+'…');
    function next(){
      if(done>=total){impLog('Готово: загружено '+total+'. Откройте вкладку «Сводка».');toast('Загружено записей: '+total);return}
      var part=docs.slice(done,done+CH);
      api({op:'imp',docs:part}).then(function(r){
        if(!r||!r.ok){impLog('Ошибка: '+((r&&r.error)||'нет связи')+'. Загружено '+done+' из '+total+'. Нажмите «Загрузить» ещё раз.');return}
        done+=part.length;impLog('Загружаю: '+done+' из '+total+'…');next();
      },function(e){impLog('Нет связи. Загружено '+done+' из '+total+'. Нажмите «Загрузить» ещё раз.')});
    }
    next();
  };
  rd.readAsText(f);
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.classList.contains('modalbg')&&e.target!==b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');var d=st.draft;
  var m=me();
  switch(a){
    case 'navBack':case 'navFwd':{var dk=v==='dir'?'dirOff':'dispOff';var ck=v==='dir'?'dirDay':'day';var o=(st[dk]||0)+(a==='navBack'?-14:14);st[dk]=o;var nd=dkey(addDays(new Date(),o));st[ck]=nd;v==='dir'?renderDirector():renderDispatcher();break}
    case 'navToday':{if(v==='dir'){st.dirOff=0;st.dirDay=dkey(addDays(new Date(),1));renderDirector()}else{st.dispOff=0;st.day=dkey(addDays(new Date(),1));renderDispatcher()}break}
    case 'per':st.per=v;renderSvodka();break;
    case 'impGo':runImport();break;
    case 'tab':st.tab=v;st.pending=null;render();break;
    case 'draftDay':d.day=v;renderForeman();break;
    case 'addItem':d.items.push(newItem(v));renderForeman();break;
    case 'rmItem':d.items.splice(+v,1);renderForeman();break;
    case 'submitReq':submitReq();break;
    case 'cancelReq':confirmTwice('cancel:'+v,function(){del('requests',v).then(function(){toast('Заявка отменена')})});break;
    case 'dispDay':st.day=v;renderDispatcher();break;
    case 'dirDay':st.dirDay=v;renderDirector();break;
    case 'repair':{var veh=byId(S.fleet,v);if(veh)upd('fleet',v,{status:veh.status==='repair'?'ok':'repair'}).then(function(){toast(veh.status==='repair'?veh.name+' вернулась в работу':veh.name+' в ремонте')});break}
    case 'openAssign':openAssign(b.getAttribute('data-r'),b.getAttribute('data-i'));break;
    case 'closeModal':st.modal=null;renderModal();break;
    case 'openFact':openFact(b.getAttribute('data-r'),b.getAttribute('data-i'));break;
    case 'fSave':saveFact();break;
    case 'fClear':{var Mq=st.modal;var rq=byId(S.requests,Mq.rid);var its=clone(rq.items);var iq=its.filter(function(x){return x.id===Mq.iid})[0];delete iq.fact;upd('requests',rq.id,{items:its}).then(function(){st.modal=null;$('#modalHost').innerHTML='';toast('Факт очищен')});break}
    case 'fHireAdd':st.modal.f.hired.push({carrier:'',vol:'',trips:''});renderModal();break;
    case 'fHireRm':st.modal.f.hired.splice(+v,1);renderModal();break;
    case 'mToggle':{var i=st.modal.own.indexOf(v);if(i>=0)st.modal.own.splice(i,1);else st.modal.own.push(v);renderModal();break}
    case 'mAllFree':{var r=byId(S.requests,st.modal.rid);var used=usedBy(r.date,st.modal.iid);var it=r.items.filter(function(x){return x.id===st.modal.iid})[0];var need=needOf(it);var own=[];ownSam().forEach(function(x){if(x.status!=='repair'&&!used[x.id]&&own.length<need)own.push(x.id)});st.modal.own=own;renderModal();break}
    case 'mHireAdd':st.modal.hired.push({carrier:'',count:1});renderModal();break;
    case 'mHireRm':st.modal.hired.splice(+v,1);renderModal();break;
    case 'mNewCarrierAdd':{var nm=String(st.modal.newCarrier||'').trim();if(!nm)break;if(!S.carriers.some(function(c){return c.name===nm}))put('carriers',slug(nm)+'-'+Math.random().toString(36).slice(2,5),{name:nm});if(byId(S.requests,st.modal.rid).items.filter(function(x){return x.id===st.modal.iid})[0].type==='samo')st.modal.agreed=nm;else{var last=st.modal.hired[st.modal.hired.length-1];if(last&&!last.carrier)last.carrier=nm;else st.modal.hired.push({carrier:nm,count:1})}st.modal.newCarrier='';toast('Перевозчик добавлен в список');setTimeout(renderModal,250);break}
    case 'mSave':saveAssign(false);break;
    case 'mClear':saveAssign(true);break;
    case 'delReq':confirmTwice('del:'+v,function(){del('requests',v).then(function(){toast('Заявка отменена')})});break;
    case 'copyLink':{var lk=linkFor(v);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lk).then(function(){toast('Ссылка скопирована')},function(){window.prompt('Скопируйте ссылку',lk)})}else{window.prompt('Скопируйте ссылку',lk)}break}
    case 'approve':{if(!canApprove(m))break;var nowd=Date.now();put('approvals',st.day,{by:m.name,at:nowd,atStr:nowStr()}).then(function(){toast('Расстановка утверждена')});break}
    case 'unapprove':del('approvals',st.day).then(function(){toast('Утверждение снято')});break;
    case 'reqText':showText('Заявка для MAX',reqText(byId(S.requests,v)));break;
    case 'dayText':showText('Разнарядка на '+short(st.day),dayText(st.day));break;
    case 'closeText':$('#modalHost').innerHTML='';break;
    case 'copyTxt':{var ta=$('#txt');var tx=ta.value;var ok=function(){toast('Скопировано')};var fb=function(){ta.focus();ta.select();try{document.execCommand('copy');ok()}catch(x){toast('Выделите текст и скопируйте вручную')}};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(ok,fb)}else fb();break}
    case 'addF':{var n=$('#addF').value.trim();if(n)put('foremen',slug(n)+'-'+Math.random().toString(36).slice(2,5),{name:n,objects:[],active:true}).then(function(){toast('Прораб добавлен')});break}
    case 'delF':confirmTwice('delF:'+v,function(){del('foremen',v)});break;
    case 'addS':{var n2=$('#addS').value.trim();if(n2)put('staff',slug(n2)+'-'+Math.random().toString(36).slice(2,5),{name:n2,role:$('#addSr').value});break}
    case 'delS':confirmTwice('delS:'+v,function(){del('staff',v)});break;
    case 'addO':{var n3=$('#addO').value.trim();if(n3)put('objects',slug(n3).slice(0,24)+'-'+Math.random().toString(36).slice(2,5),{name:n3,short:n3.length>28?n3.slice(0,28):n3});break}
    case 'delO':confirmTwice('delO:'+v,function(){del('objects',v)});break;
    case 'addC':{var n4=$('#addC').value.trim();if(n4)put('carriers',slug(n4)+'-'+Math.random().toString(36).slice(2,5),{name:n4});break}
    case 'delC':confirmTwice('delC:'+v,function(){del('carriers',v)});break;
    case 'addV':{var n5=$('#addV').value.trim();if(n5){var k=$('#addVk').value;put('fleet','v-'+slug(n5)+'-'+Math.random().toString(36).slice(2,4),{name:n5,model:$('#addVm').value.trim(),kind:k,status:'ok',order:Date.now()%100000+1000})}break}
    case 'delV':confirmTwice('delV:'+v,function(){del('fleet',v)});break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;var c=t.getAttribute&&t.getAttribute('data-chg');if(!c)return;var d=st.draft;
  if(t.id==='who'){}
  switch(c){
    case 'navDate':{if(!t.value)break;var kd=t.getAttribute('data-v');if(kd==='dir'){st.dirDay=t.value;st.dirOff=offFor(t.value);renderDirector()}else{st.day=t.value;st.dispOff=offFor(t.value);renderDispatcher()}break}
    case 'perFrom':st.perFrom=t.value;renderSvodka();break;
    case 'perTo':st.perTo=t.value;renderSvodka();break;
    case 'foremanSel':st.draftForeman=t.value||null;st.draft=newDraft();renderForeman();break;
    case 'object':d.object=t.value;break;
    case 'item':d.items[+t.getAttribute('data-i')][t.getAttribute('data-f')]=t.value;break;
    case 'allOwn':d.items[+t.getAttribute('data-i')].allOwn=t.checked;renderForeman();break;
    case 'mAgreed':st.modal.agreed=t.value;break;
    case 'fDest':{var Fm=st.modal.f;Fm.dest=t.value;var rq2=byId(S.requests,st.modal.rid);var rt2=findRoute(rq2.object,Fm.dest);Fm.km=rt2?rt2.km:'';renderModal();break}
    case 'fOwnDriver':st.modal.f.own[+t.getAttribute('data-i')].driver=t.value;break;
    case 'fOwnKind':{var oo=st.modal.f.own[+t.getAttribute('data-i')];oo.kind=t.value;if(oo.kind!=='Рейсы'){oo.vol=oo.man?oo.vol:''}renderModal();break}
    case 'fOwnAdd':if(t.value){st.modal.f.own.push({id:t.value,driver:'',kind:'Рейсы',trips:'',hours:'',vol:'',man:false});renderModal()}break;
    case 'fHireCar':st.modal.f.hired[+t.getAttribute('data-i')].carrier=t.value;break;
    case 'mHireCar':st.modal.hired[+t.getAttribute('data-i')].carrier=t.value;break;
    case 'fObj':{var f=byId(S.foremen,t.getAttribute('data-f'));var o=t.getAttribute('data-o');var list=(f.objects||[]).slice();var ix=list.indexOf(o);if(t.checked&&ix<0)list.push(o);if(!t.checked&&ix>=0)list.splice(ix,1);upd('foremen',f.id,{objects:list});break}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;var c=t.getAttribute&&t.getAttribute('data-inp');if(!c)return;var d=st.draft;
  switch(c){
    case 'comment':d.comment=t.value;break;
    case 'item':d.items[+t.getAttribute('data-i')][t.getAttribute('data-f')]=t.value;break;
    case 'mNote':st.modal.note=t.value;break;
    case 'fKm':st.modal.f.km=t.value;recalcFact();break;
    case 'fOwnTrips':st.modal.f.own[+t.getAttribute('data-i')].trips=t.value;st.modal.f.own[+t.getAttribute('data-i')].man=false;recalcFact();break;
    case 'fOwnHours':st.modal.f.own[+t.getAttribute('data-i')].hours=t.value;break;
    case 'fOwnVol':{var ov=st.modal.f.own[+t.getAttribute('data-i')];ov.vol=t.value;ov.man=true;recalcFact();break}
    case 'fHireVol':st.modal.f.hired[+t.getAttribute('data-i')].vol=t.value;recalcFact();break;
    case 'fHireTrips':st.modal.f.hired[+t.getAttribute('data-i')].trips=t.value;break;
    case 'fNote':st.modal.f.note=t.value;break;
    case 'mHireCnt':st.modal.hired[+t.getAttribute('data-i')].count=+t.value;break;
    case 'mNewCarrier':st.modal.newCarrier=t.value;break;
  }
});
/* ---------- boot ---------- */
function afterData(){
  if(!ME)return;
  if(!st.loaded){
    st.loaded=true;
    var t=tabsFor(ME);st.tab=t.length?t[0][0]:'foreman';
  }
  var ae=document.activeElement;var typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')&&!st.modal;
  if(typing){renderHeader();if(st.tab==='foreman')renderMine();return}
  if(st.modal){renderHeader();renderModal();if(st.tab!=='foreman')renderMainOnly();else renderMine();return}
  render();
}
function renderMainOnly(){var t=st.tab;if(t==='dispatcher')renderDispatcher();else if(t==='director')renderDirector();else if(t==='svodka')renderSvodka();else if(t==='admin')renderAdmin()}
function refresh(force){
  if(inflight>0&&!force)return;
  api({op:'boot',v:force?null:VER}).then(function(r){
    if(!r.ok){
      $('#main').innerHTML='<div class="empty">'+(r.error==='auth'?'Эта ссылка не действует. Попросите у администратора личную ссылку.':'Ошибка: '+esc(r.error))+'</div>';ME=null;return;
    }
    if(r.same||inflight>0)return;
    VER=r.ver;ME=r.me;
    if(ME.kind==='foreman'){ME.ref=byId(r.data.foremen,ME.id)}
    for(var k in r.data)S[k]=r.data[k];
    afterData();
  }).catch(function(){
    if(!ME)$('#main').innerHTML='<div class="empty">Нет связи с сервером. Обновите страницу.</div>';
  });
}
(function init(){
  if(!TOKEN){$('#main').innerHTML='<div class="empty">Откройте систему по своей личной ссылке.</div>';return}
  if(!window.ZV_URL||window.ZV_URL.indexOf('http')!==0){$('#main').innerHTML='<div class="empty">Система ещё не подключена к серверу.</div>';return}
  $('#main').innerHTML='<div class="empty">Загружаю…</div>';
  refresh(true);
  setInterval(function(){if(document.visibilityState==='visible')refresh(false)},12000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh(false)});
})();
})();
</script>
