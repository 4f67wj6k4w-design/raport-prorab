<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Заявки на вывоз</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: узкая колонка для прораба, широкая двухколоночная сетка для диспетчера и директора. Палитра взята из прототипа: тёмно-зелёный, тёплый светлый фон. */
:root{
  --brand:#2E671F; --bg:#eef1ec; --card:#ffffff; --fg:#18221a; --muted:#5a6758; --line:#cbd4c7; --soft:#e2e8df;
  --accent:#2E671F; --accent-fg:#ffffff; --accent-soft:#dbe8d6;
  --warn:#b26b00; --warn-soft:#f6e6cc; --bad:#b3362c; --bad-soft:#f6dcd9; --info:#2a5b86; --info-soft:#dde9f4;
  --c-plan:#4a86e8; --c-fact:#2E671F; --c-rest:#cbd4c7;
  --font:'IBM Plex Sans Condensed','Arial Narrow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2E671F; --bg:#111612; --card:#1a211b; --fg:#e6ede5; --muted:#9aa898; --line:#344035; --soft:#232c24;
  --accent:#5f9e4b; --accent-fg:#0c1709; --accent-soft:#243a1f;
  --warn:#e3a33c; --warn-soft:#3a2d14; --bad:#ec6a5e; --bad-soft:#3d1d22; --info:#8fbbe6; --info-soft:#1b2f43;
  --c-fact:#6aa84f; --c-rest:#3a463b; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2E671F; --bg:#111612; --card:#1a211b; --fg:#e6ede5; --muted:#9aa898; --line:#344035; --soft:#232c24;
  --accent:#5f9e4b; --accent-fg:#0c1709; --accent-soft:#243a1f;
  --warn:#e3a33c; --warn-soft:#3a2d14; --bad:#ec6a5e; --bad-soft:#3d1d22; --info:#8fbbe6; --info-soft:#1b2f43;
  --c-fact:#6aa84f; --c-rest:#3a463b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:17px;line-height:1.15}.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.who{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.new{background:var(--warn-soft);color:var(--warn)}.pill.part{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--accent);color:var(--accent-fg)}.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.narrow{max-width:460px;margin:0 auto}
h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
.item .row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin-top:8px}
.item .row>*{min-width:0}
.itemhead{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.req{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--card)}
.reqhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.reqhead b{min-width:0;overflow-wrap:anywhere}
.line{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.line .assign{color:var(--accent);font-size:13px;overflow-wrap:anywhere}
.line .assign.none{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}.fline{font-size:13px;color:var(--info);margin:-2px 0 6px}.frow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1fr) 62px 62px 74px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.frow input{width:100%}.fhead{font-size:12px;color:var(--muted);border-top:0}@media (max-width:700px){.frow{grid-template-columns:1fr 1fr}.fhead{display:none}}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}.daynav input{font:inherit}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);display:block}.kpi b{font-size:24px;font-family:var(--mono);display:block;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.days .chip{flex:none}
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.veh{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:5px 8px;background:var(--card);font-size:12px;text-align:left;cursor:pointer;min-width:0}
.veh b{display:block;font-size:13px}.veh span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.veh.used{border-left-color:var(--accent);background:var(--accent-soft)}
.veh.repair{border-left-color:var(--bad);background:var(--bad-soft)}
.veh.sel{outline:2px solid var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
.veh.busy{opacity:.45;cursor:not-allowed}
.modalbg{position:fixed;inset:0;background:rgba(10,14,8,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.approve{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.approve.stale{background:var(--warn-soft);border-color:var(--warn)}
.bars .b{display:grid;grid-template-columns:minmax(0,150px) 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .t{height:14px;background:var(--soft);border-radius:7px;overflow:hidden;display:flex}
.bars .t i{display:block;height:100%}
.bars .n{overflow-wrap:anywhere}
.trend{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0;text-align:center;font-size:11px;color:var(--muted)}
.trend .stack{display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.trend .stack i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-own{background:var(--accent)}.c-hire{background:var(--info)}.c-need{background:var(--warn)}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:10px}
.tag{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .grid2,.cols2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line{grid-template-columns:minmax(0,1fr) auto}
  .line .assign{grid-column:1/-1;order:3}
  .who{margin-left:0;width:100%}
  .who select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* шапка как в отчёте ПТО */
header{background:var(--brand);color:#fff;border-radius:14px;padding:12px 16px;border:0;margin-top:12px}
header .logo{background:#fff;color:var(--brand)}
header .brand span,header .who{color:rgba(255,255,255,.8)}
header .tabs{background:rgba(255,255,255,.14)}
.themefab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.themebtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;margin-left:6px}
header .tab{color:rgba(255,255,255,.85)}
header .tab[aria-selected="true"]{background:#fff;color:#18221a}
/* сводка */
.sv .persec{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.sv .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.sv .seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--fg);min-height:40px}
.sv .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sv .pnav{display:flex;align-items:center;gap:6px}
.sv .pnav .btn{padding:0;width:40px;height:40px;font-size:20px;line-height:1}
.sv .plabel{min-width:150px;text-align:center;font-weight:700;font-size:16px}
.sv .pdates{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--muted)}
.sv .pdates input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:40px}
.sv .viewsw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.sv .secttl{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600}
.sv .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px}
.sv .tl{background:var(--soft);border-radius:10px;padding:11px 13px;min-width:0}
.sv .tl small{display:block;color:var(--muted);font-size:12px;line-height:1.3;min-height:2.4em}
.sv .tl b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.sv .tl b u{text-decoration:none;font-size:13px;font-weight:400;color:var(--muted);margin-left:5px}
.sv .tl.hero{background:var(--accent);color:var(--accent-fg)}
.sv .tl.hero small,.sv .tl.hero b u,.sv .tl.hero .muted{color:rgba(255,255,255,.8)}
.sv .tl.hero .s,.sv .tl.hero .s em{color:rgba(255,255,255,.9)}
.sv .tl.hero b{font-size:30px}
.sv .tl .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.sv .tl .s em{font-style:normal;font-family:var(--mono);color:var(--fg);font-weight:600}
.sv .tl .s em.ok{color:var(--accent)}.sv .tl .s em.bad,.sv .tl .s .warnc{color:var(--bad)}
.sv .tl.hero .s em,.sv .tl.hero .s em.ok,.sv .tl.hero .s em.bad{color:#fff}
.sv .note{background:var(--soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--fg)}
.sv .sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px;margin-top:12px}
.sv .sgrid>.card{min-width:0;padding:14px;border-radius:12px}
.sv .card h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.sv .chart{width:100%;min-width:0}.sv .chart svg{display:block;width:100%;height:auto}
.sv svg.hm{display:block;width:auto;max-width:none;height:auto}
.sv svg.hm .tick{font:11px var(--font);fill:var(--muted)}
.sv .chart .grid{stroke:var(--line);stroke-width:1;opacity:.6}
.sv .chart .tick{font:11px var(--font);fill:var(--muted)}
.sv .chart .dot{stroke:var(--card);stroke-width:2}
.sv .legend i.ln{height:3px;width:16px;border-radius:0;vertical-align:3px}
.sv .legend i.dash{height:0;width:16px;border-top:2px dashed currentColor;border-radius:0;vertical-align:3px;background:none}
.sv .hb{display:flex;flex-direction:column;gap:8px}
.sv .hb-r{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.sv .hb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv .hb-t{display:flex;height:14px;background:var(--soft);border-radius:0 4px 4px 0;overflow:hidden}
.sv .hb-t i{display:block;height:100%}
.sv .hb-v{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right;white-space:nowrap}
.sv .tablewrap{overflow-x:auto;max-width:100%}
.sv table.t th,.sv table.t td{padding:7px 8px;white-space:nowrap}
.sv table.t th.n,.sv table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sv table.t th.l,.sv table.t td.l{text-align:left;white-space:normal;font-family:var(--font)}
.sv table.t tbody tr:hover{background:var(--soft)}
.sv table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
@media (max-width:620px){.sv .pdates{margin-left:0}.sv .plabel{min-width:0;flex:1}}

body{min-height:100vh}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#1d4713 0%,#2E671F 55%,#3f8c2b 100%);border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(30,70,20,.25);padding:14px 22px;margin-top:0}
header:before{content:"";position:absolute;right:-60px;top:-90px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(255,255,255,.06);pointer-events:none}
header:after{content:"";position:absolute;right:120px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.05);pointer-events:none}
header>*{position:relative;z-index:1}
header .brand{gap:16px}header .brand img{height:48px;width:auto;display:block;flex:none}
header .brand b{font-size:21px;font-weight:700}
header .tabs{background:transparent;padding:0;gap:6px}
header .tab{padding:7px 18px;color:#dcefd4;font-weight:600;font-size:15px}
header .tab:hover{background:rgba(255,255,255,.14)}
header .tab[aria-selected="true"]{background:#fff;color:#1d4713;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card{background:color-mix(in srgb,var(--card) 95%,transparent);box-shadow:0 2px 10px rgba(20,40,20,.08)}
.wrap{padding-top:0}
@media (max-width:700px){header{padding:12px 14px}header .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;width:100%}header .tab{white-space:nowrap;padding:7px 12px;font-size:14px}}
.intro,#main>.muted,.sv>.muted,.sv>.small.muted{display:block;background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:10px;padding:8px 12px;color:var(--fg);box-shadow:0 1px 6px rgba(20,40,20,.08);width:fit-content;max-width:100%}
.sv>h2,#main>h2{text-shadow:none}
</style>

<script>
(function(){
"use strict";
var S={foremen:[],objects:[],carriers:[],fleet:[],staff:[],requests:[],approvals:[],drivers:[],routes:[],places:[],payments:[],recon:[],settings:[],adjust:[],plans:[]};
var ready={};
var st={tab:'foreman',who:null,day:null,dirDay:null,draft:null,draftForeman:null,modal:null,pending:null,loaded:false};
var MAT_DEF=['Ж/Б','Кирпич','Микс (Ж/Б, кирпич)','Дерево','Грунт','Песок','ТБО','Асфальт','Металл (лом)','Строительный мусор'];
function mats(){var s=byId(S.settings||[],'materials');if(s){try{var a=JSON.parse(s.val);if(a&&a.length)return a}catch(e){}}return MAT_DEF}
var DESTS=['На усмотрение диспетчера','МЭР Подольск','Рябиновая','КПТС','По месту'];
var TYPES={vyvoz:'Вывоз',mesto:'По месту',samo:'Самовывоз',polivo:'Поливомоечная'};
var TYPE_HINT={vyvoz:'Самосвалы вывозят материал с объекта',mesto:'Перевозка внутри объекта или рядом',samo:'Материал забирает перевозчик',polivo:'Уборка и мойка дороги'};

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function short(k){var d=parseKey(k);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+WD[d.getDay()]}
function today(){return dkey(new Date())}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function nowStr(){var d=new Date();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' в '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toast(t){var h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';setTimeout(function(){h.innerHTML=''},2600)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function sortBy(list,f){return list.slice().sort(function(a,b){var x=f(a),y=f(b);return x<y?-1:x>y?1:0})}

/* ---------- people ---------- */
var ME=null;
function me(){return ME}
function isStaff(m){return m&&(m.kind==='dispatcher'||m.kind==='approver'||m.kind==='admin')}
function canAssign(m){return m&&(m.kind==='dispatcher'||m.kind==='admin')}
function canApprove(m){return m&&(m.kind==='approver'||m.kind==='admin')}
var ROLE_NAMES={pm:'руководитель проекта',foreman:'прораб',dispatcher:'диспетчер',approver:'коммерческий директор',director:'генеральный директор',admin:'администратор'};
function tabsFor(m){
  var t=baseTabs(m);if(!m)return t;if(m.kind==='foreman'){if(m.pm)t=t.concat([['totals','Итоги вывоза']]);return CFG().features.plan?t.concat([['plan','План вывоза']]):t}
  var F=CFG().features,ex=[['salary','Зарплата'],['econ','Экономика Renault']];
  if(m.kind==='approver'||m.kind==='admin')ex.unshift(['qa','Вопросы']);
  if(F.plan)ex.push(['plan','План/факт']);if(F.adv)ex.push(['adv','Авансы']);
  var i=-1;t.forEach(function(x,k){if(x[0]==='admin')i=k});
  if(i<0)return t.concat(ex);return t.slice(0,i).concat(ex,t.slice(i));
}
function baseTabs(m){
  if(!m)return [];
  if(m.kind==='foreman')return [['foreman','Заявка']];
  if(m.kind==='dispatcher')return [['dispatcher','Диспетчер'],['foreman','Новая заявка'],['debts','Долги и сверка'],['admin','Справочники']];
  if(m.kind==='approver')return [['dispatcher','Расстановка'],['svodka','Сводка'],['director','По дням'],['debts','Долги и сверка'],['admin','Справочники']];
  if(m.kind==='director')return [['svodka','Сводка'],['director','По дням'],['debts','Долги и сверка']];
  return [['dispatcher','Диспетчер'],['foreman','Новая заявка'],['svodka','Сводка'],['director','По дням'],['debts','Долги и сверка'],['admin','Справочники']];
}
/* ---------- fleet & demand ---------- */
function ownSam(){return S.fleet.filter(function(v){return v.kind==='sam'})}
function ownPmm(){return S.fleet.filter(function(v){return v.kind==='pmm'})}
function needOf(it){
  if(it.type==='polivo')return 1;
  if(it.type==='samo')return 0;
  if(it.allOwn)return ownSam().filter(function(v){return v.status!=='repair'}).length;
  return +it.count||0;
}
function assignedCount(it){
  var a=it.assigned||{};var n=(a.own||[]).length;(a.hired||[]).forEach(function(h){n+=(+h.count||0)});return n;
}
function itemDone(it){
  if(it.type==='samo')return !!(it.assigned&&it.assigned.agreed);
  var need=needOf(it);return need>0&&assignedCount(it)>=need;
}
function itemTouched(it){var a=it.assigned;if(!a)return false;return (a.own&&a.own.length)||(a.hired&&a.hired.length)||a.agreed}
function reqStatus(r){
  var its=r.items||[];if(!its.length)return 'new';
  var d=its.filter(itemDone).length;
  if(d===its.length)return 'done';
  if(its.some(itemTouched))return 'part';
  return 'new';
}
function statusPill(s){return s==='done'?'<span class="pill done">Назначена</span>':s==='part'?'<span class="pill part">Частично</span>':'<span class="pill new">Новая</span>'}
function slotsText(it){var a=(it.slots||[]).filter(function(x){return +x.n>0&&x.t}).map(function(x){return x.n+' к '+x.t});return a.length?' · подача: '+a.join(', '):''}
function itemTitle(it){
  var t=TYPES[it.type]+': ';
  if(it.type==='polivo')return t+(it.note||'Поливомоечная');
  t+=it.material||'—';
  if(it.type==='samo'){if(it.volume)t+=' · '+it.volume+(/\D/.test(it.volume)?'':' м³');if(+it.count)t+=' · '+it.count+' маш.';return t}
  if(it.allOwn)t+=' · все свои Renault';else t+=' · '+(+it.count||0)+' маш.';
  if(it.type==='vyvoz'&&it.dest&&it.dest!=='На усмотрение диспетчера')t+=' → '+it.dest;
  return t+slotsText(it);
}
function assignText(it){
  var a=it.assigned||{};var p=[];
  if(a.agreed)p.push('согласовано · '+a.agreed);
  if(a.own&&a.own.length){p.push('свои '+a.own.map(function(id){var v=byId(S.fleet,id);return v?v.name:id}).join(', '))}
  (a.hired||[]).forEach(function(h){p.push(h.carrier+' × '+h.count)});
  return p.join(' · ');
}
function dayRequests(day){return S.requests.filter(function(r){return r.date===day})}
function usedBy(day,exceptItem){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(it.id===exceptItem)return;
    ((it.assigned||{}).own||[]).forEach(function(id){m[id]={obj:objName(r.object),short:objShort(r.object)}});
  })});
  return m;
}
function objName(code){var o=byId(S.objects,code);return o?o.name:code}
function objShort(code){var o=byId(S.objects,code);return o?(o.short||o.name):code}
function dayStats(day){
  var need=0,own=0,hired=0,missing=0;
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(it.type!=='samo')need+=needOf(it);
    var a=it.assigned||{};own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){hired+=(+h.count||0)});
    if(!itemDone(it))missing++;
  })});
  var fv=dayFact(day);
  return {need:need,own:own,hired:hired,missing:missing,factVol:fv.vol};
}
function approval(day){return byId(S.approvals,day)}


/* ---------- факт вывоза ---------- */
var KINDS=['Рейсы','По месту','Простой','Ремонт/ТО','Без водителя'];
var ROUTE_K=2.2;
function num(x){x=parseFloat(String(x).replace(',','.'));return isFinite(x)?x:0}
function r1(x){return Math.round(x*100)/100}
function factOf(it){return it.fact||null}
function factTotals(it){
  var f=it.fact;if(!f)return {own:0,hired:0,vol:0,trips:0,km:0};
  var own=0,hired=0,trips=0;
  (f.own||[]).forEach(function(o){own+=num(o.vol);if(o.kind==='Рейсы'||!o.kind)trips+=num(o.trips)});
  (f.hired||[]).forEach(function(h){hired+=num(h.vol);trips+=0});
  return {own:own,hired:hired,vol:own+hired,trips:trips,km:num(f.km)*trips*CFG().kmK,ownTrips:trips};
}
/* ---------- цена ₽/м³ и начисление ---------- */
function lastPrice(car,obj){
  if(!car)return '';var best=null,any=null;
  S.requests.forEach(function(r){(r.items||[]).forEach(function(it){
    var rows=[];var a=it.assigned||{};
    (a.hired||[]).forEach(function(h){if(h.carrier===car)rows.push(+h.price)});
    if(a.agreed===car)rows.push(+a.price);
    if(it.fact)(it.fact.hired||[]).forEach(function(h){if(h.carrier===car)rows.push(+h.price)});
    rows.forEach(function(p){if(!(p>0))return;if(!any||r.date>=any.d)any={d:r.date,p:p};if(r.object===obj&&(!best||r.date>=best.d))best={d:r.date,p:p}});
  })});
  return best?best.p:any?any.p:'';
}
function rub(x){return fmt(x,0)+' ₽'}

var CFG_DEF={amort:12,fuelPrice:80,fuelNorm:68,kmK:2.2,shift:2000,hourRate:650,placeRate:3300,idleMin:0,targetDay:40000,targetMargin:35,ecoDebt:1,

var _cfgKey=null,_cfg=null;
function CFG(){
  var d=byId(S.settings||[],'calc'),k=d&&d.val?String(d.val):'';
  if(_cfg&&_cfgKey===k)return _cfg;
  var u={};try{u=k?JSON.parse(k):{}}catch(e){}
  var c=JSON.parse(JSON.stringify(CFG_DEF));
  Object.keys(u).forEach(function(n){
    if(n==='features'){Object.keys(u.features||{}).forEach(function(f){c.features[f]=!!u.features[f]})}
    else if(n==='tariff'){if(Array.isArray(u.tariff)&&u.tariff.length)c.tariff=u.tariff.map(function(t){return [num(t[0]),num(t[1])]})}
    else if(isFinite(+u[n])&&u[n]!=='')c[n]=+u[n];

}

function ownLines(from,to){

  S.requests.forEach(function(r){
    if(r.date<from||r.date>to)return;
    (r.items||[]).forEach(function(it){
      var f=it.fact;if(!f)return;
      var km=num(f.km),rt=findRoute(r.object,f.dest),rprice=rt&&num(rt.price)>0?num(rt.price):0;
      (f.own||[]).forEach(function(o){
        var isTrip=(o.kind==='Рейсы'||!o.kind),tr=isTrip?num(o.trips):0,hrs=num(o.hours),vol=num(o.vol);
        var rate=tr?(num(o.rate)>0?num(o.rate):tariffFor(km)):0,hpay=0;
        if(o.kind==='По месту')hpay=hrs*C.hourRate;else if(o.kind==='Простой'&&hrs>=C.idleMin)hpay=hrs*C.hourRate;
        var price=num(o.price)>0?num(o.price):rprice;

        var l={date:r.date,obj:r.object,veh:o.id,drv:o.driver||'',kind:o.kind||'Рейсы',trips:tr,hours:hrs,paidHours:hpay?hrs:0,km:km,vol:vol,rate:rate,trip:tr*rate,hpay:hpay,came:came,shift:0,rev:rev,mil:mil,fuel:mil/100*C.fuelNorm*C.fuelPrice,amort:mil*C.amort,noPrice:!!(isTrip&&vol&&!price),idle:num(o.il)+num(o.iu),dest:f.dest||''};
        if(came){var k=l.drv+'|'+r.date;if(!seen[k]){seen[k]=1;l.shift=C.shift}}

  function g(n){return D[n]=D[n]||{drv:n,days:{},trips:0,trip:0,hrs:0,hpay:0,shift:0,adj:0}}
  L.forEach(function(l){if(!l.drv)return;var x=g(l.drv);if(l.came)x.days[l.date]=1;x.trips+=l.trips;x.trip+=l.trip;x.hrs+=l.paidHours;x.hpay+=l.hpay;x.shift+=l.shift});
  var AJ=(S.adjust||[]).filter(function(a){return a.month===ym});

function planObjects(){
  var m=ME||{};
  if(m.kind==='foreman'){var f=byId(S.foremen,m.id);return ((f&&f.objects)||[]).map(function(c){return byId(S.objects,c)}).filter(Boolean)}
  var seen={},o=[];S.foremen.forEach(function(f){(f.objects||[]).forEach(function(c){if(!seen[c]){seen[c]=1;var x=byId(S.objects,c);if(x)o.push(x)}})});
  return o.length?o:S.objects.slice();
}
function planDue(ym){
  var p=ym.split('-'),y=+p[0],m=+p[1]-1,py=m===0?y-1:y,pm=m===0?11:m-1;
  var last=new Date(py,pm+1,0).getDate(),d=new Date(py,pm,Math.min(30,last));
  if(d.getDay()===0||d.getDay()===6){d=new Date(py,pm+1,0);while(d.getDay()!==5)d.setDate(d.getDate()-1)}
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
var WD=['вс','пн','вт','ср','чт','пт','сб'];
/* рабочая неделя пн–сб, воскресенье выходной */
function workDays(a,b){var n=0;if(!a||!b||a>b)return 0;for(var d=parseKey(a),e=parseKey(b);d<=e;d=addDays(d,1))if(d.getDay()!==0)n++;return n}
function planBounds(p){
  if(p.from&&p.to)return {from:p.from,to:p.to};
  if(p.month){var q=p.month.split('-'),y=+q[0],m=+q[1]-1;return {from:dkey(new Date(y,m,1)),to:dkey(new Date(y,m+1,0))}}
  return {from:p.from||'',to:p.to||''};
}
/* норма на сегодня: пропорционально рабочим дням (пн–сб), по вчерашний день включительно */
function planNorm(p){
  var b=planBounds(p),tot=workDays(b.from,b.to),pv=num(p.vol);if(!tot)return null;
  var y=dkey(addDays(new Date(),-1)),upto=y<b.from?null:(y>b.to?b.to:y),done=upto?workDays(b.from,upto):0;
  return {perDay:pv/tot,tot:tot,done:done,norm:pv/tot*done,left:Math.max(0,tot-done)};
}
function planFact(p){var f=0;S.requests.forEach(function(r){if(r.object!==p.object)return;if(p.from&&r.date<p.from)return;if(p.to&&r.date>p.to)return;(r.items||[]).forEach(function(it){if(!it.fact)return;(it.fact.own||[]).forEach(function(o){f+=num(o.vol)});(it.fact.hired||[]).forEach(function(x){f+=num(x.vol)})})});return f}
function planStatusCard(){
  var ym=monthShift(today().slice(0,7),1),due=planDue(ym),objs=planObjects(),have={};
  (S.plans||[]).forEach(function(p){if(p.month===ym)have[p.object]=1});
  var miss=objs.filter(function(o){return !have[o.id]}),late=today()>due;
  var dd=parseKey(due);
  var h='<div class="card"><h3 style="margin:0 0 6px">Планы вывоза на '+esc(monthLabel(ym))+'</h3><div class="small" style="margin-bottom:8px">Срок подачи: <b>'+dmy(due)+' ('+WD[dd.getDay()]+')</b>'+(late&&miss.length?' · <span style="color:var(--bad)"><b>срок прошёл</b></span>':'')+'. Если 30-е выпадает на выходной, срок — последняя пятница месяца. Руководитель проекта вносит план по своим объектам; после сохранения план фиксируется, изменить его можно только корректировкой с комментарием.</div>';
  if(!objs.length)h+='<div class="small muted">За вами не закреплён ни один объект.</div>';
  else{
    h+='<div class="chips">'+objs.map(function(o){return '<span class="chip" style="'+(have[o.id]?'background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)':'background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)')+'">'+(have[o.id]?'✓ ':'нет плана · ')+esc(o.short||o.name)+'</span>'}).join('')+'</div>';
    h+='<div class="small muted" style="margin-top:6px">Подано '+(objs.length-miss.length)+' из '+objs.length+'.</div>';
  }
  return h+'</div>';
}

    });
    h+='</tbody></table></div>';
  }

  el.innerHTML='<div class="sv">'+h+'</div>';

/* ---------- Долги и сверка ---------- */
var STAGES=[['','Реестр не получен'],['reg','Реестр получен'],['agr','Сверен, согласован диспетчером'],['edo','Счёт, реестр и УПД в ЭДО'],['chk','На проверке'],['sgn','Подписано коммерческим директором'],['acc','Передано в бухгалтерию']];
var PAYKINDS={pay:'Оплата',adv:'Аванс (не в долге)',open:'Остаток долга на дату'};
function stageName(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===(k||''))return STAGES[i][1];return k||''}
function stageIdx(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===(k||''))return i;return 0}
function mondayOf(day){return weekOf(day)[0]}
function reconId(wk,car){return 'rc-'+wk+'-'+slug(car)}
function finCan(coll){var k=ME&&ME.kind;if(k==='admin'||k==='dispatcher')return true;if(k==='foreman')return coll==='plans';return k==='approver'&&(coll==='recon'||coll==='plans'||coll==='adjust'||coll==='payments')}
function priceStart(){var d='9999-99-99';S.requests.forEach(function(r){if(r.date>=d)return;(r.items||[]).forEach(function(it){var f=it.fact;if(f)(f.hired||[]).forEach(function(h){if(num(h.price)>0&&r.date<d)d=r.date})})});return d}
function carFin(from,to){
  var m={},ps=priceStart();
  S.requests.forEach(function(r){if(r.date<from||r.date>to)return;(r.items||[]).forEach(function(it){var f=it.fact;if(!f)return;(f.hired||[]).forEach(function(h){
    if(!h.carrier)return;var x=m[h.carrier]=m[h.carrier]||{vol:0,rap:0,rapAll:true,sum:0,np:0};
    var v=num(h.vol);x.vol+=v;if(h.rap!==undefined&&h.rap!=='')x.rap+=num(h.rap);else if(v)x.rapAll=false;
    var p=num(h.price);if(ndb(h,it)){}else if(p>0)x.sum+=v*p;else if(v&&r.date>=ps)x.np++;
  })})});
  return m;
}
function debtTable(){
  var m={},ps=priceStart();
  function g(c){return m[c]=m[c]||{car:c,open:0,openDate:'',acc:0,paid:0,adv:0,np:0}}
  (S.payments||[]).forEach(function(p){if(p.kind==='open'){var x=g(p.carrier);if(!x.openDate||p.date>x.openDate){x.openDate=p.date;x.open=num(p.amount)}}});
  S.requests.forEach(function(r){(r.items||[]).forEach(function(it){var f=it.fact;if(!f)return;(f.hired||[]).forEach(function(h){
    if(!h.carrier)return;var v=num(h.vol);if(!v)return;var x=m[h.carrier];if(x&&x.openDate&&r.date<=x.openDate)return;
    x=g(h.carrier);var p=num(h.price);if(ndb(h,it)){}else if(p>0)x.acc+=v*p;else if(r.date>=ps)x.np++;
  })})});
  (S.payments||[]).forEach(function(p){var x=g(p.carrier);if(p.kind==='pay'){if(!x.openDate||p.date>x.openDate)x.paid+=num(p.amount)}else if(p.kind==='adv')x.adv+=num(p.amount)});
  Object.keys(m).forEach(function(k){var x=m[k];x.debt=x.open+x.acc-x.paid});
  return m;
}
function dmy(k){if(!k)return '';var p=k.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function renderDebts(){
  var el=$('#main');if(!st.loaded){el.innerHTML='<div class="empty">Загружаю…</div>';return}
  var canP=finCan('payments'),canR=finCan('recon');
  var wk=st.dbWeek||(st.dbWeek=mondayOf(today())),we=dkey(addDays(parseKey(wk),6));
  var T=debtTable();

var TOKEN=(new URLSearchParams(location.search)).get('t')||'';
var VER=null, inflight=0;
var PASS='';try{PASS=localStorage.getItem('zvp:'+TOKEN)||''}catch(e){}
function api(body){
  body.t=TOKEN;body.p=PASS;
  return fetch(window.ZV_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function localApply(kind,coll,id,data){
  var list=S[coll];var i=-1;for(var k=0;k<list.length;k++)if(list[k].id===id){i=k;break}
  if(kind==='delete'){if(i>=0)list.splice(i,1)}
  else if(kind==='update'){if(i>=0)for(var f in data)list[i][f]=data[f]}
  else{var x=JSON.parse(JSON.stringify(data));x.id=id;if(i>=0)list[i]=x;else list.push(x)}
  afterData();
}
function write(kind,coll,id,data){
  localApply(kind,coll,id,data||{});
  inflight++;
  return api({op:'w',kind:kind,coll:coll,id:id,data:data||null}).then(function(r){
    inflight--;
    if(!r||!r.ok){var e=new Error(r&&r.error||'нет связи');refresh(true);throw e}
    VER=r.ver;return r;
  },function(err){inflight--;refresh(true);throw err});
}
function put(coll,id,data){return write('set',coll,id,data).catch(fail)}
function upd(coll,id,data){return write('update',coll,id,data).catch(fail)}
function del(coll,id){return write('delete',coll,id).catch(fail)}
function fail(e){toast('Не удалось сохранить: '+(e&&e.message||e));throw e}
function newId(){return 'z'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function submitReq(){
  var d=st.draft,f=currentForeman(),m=me();
  if(!f||!d.object||!d.items.length)return;
  for(var i=0;i<d.items.length;i++){var it=d.items[i];

      syncCount(it);
      if(!(+it.count>0)){toast('Укажите число машин');return}
      if((it.slots||[]).some(function(x){return !x.t})){toast('Выберите время подачи для каждой строки');return}

  }
  var items=clone(d.items).map(function(it){if(it.count!=null)it.count=+it.count||0;if(it.allOwn)delete it.slots;if(it.slots){it.slots=it.slots.filter(function(x){return +x.n>0&&x.t});if(!it.slots.length)delete it.slots}return it});
  var rec={date:d.day,object:d.object,foremanId:f.id,foremanName:f.name,items:items,comment:d.comment,createdAt:Date.now(),sentAt:nowStr(),byStaff:isStaff(m)?m.name:'',log:[]};
  put('requests',newId(),rec).then(function(){
    st.draft=newDraft();toast('Заявка отправлена диспетчеру');renderForeman();

}

function approveBar(day,reqs,m){
  if(!reqs.length)return '';
  var a=approval(day);
  var lastEdit=0;reqs.forEach(function(r){lastEdit=Math.max(lastEdit,r.editedAt||r.createdAt||0)});
  var stale=a&&lastEdit>(a.at||0);
  var ok=reqs.every(function(r){return reqStatus(r)==='done'});
  var h;
  if(a&&!stale){
    h='<div class="approve"><div><b>Расстановка утверждена</b><div class="small muted">'+esc(a.by)+', '+esc(a.atStr||'')+'</div></div>'+(canApprove(m)?'<button class="btn sm" data-act="unapprove">Снять утверждение</button>':'')+'</div>';

function dayText(day){

    var a=it.assigned||{};var what=objShort(r.object)+': '+itemTitle(it).replace(/ · все свои Renault/,'').replace(/ · \d+ маш\./,'');

  h+='<div class="cols2"><div class="card"><h3>Машины по дням</h3><div class="legend"><span><i class="c-own"></i>свои</span><span><i class="c-hire"></i>наёмные</span><span><i class="c-need"></i>не закрыто</span></div>'+trendHtml(days.slice(5,13),day)+'</div>';
  h+='<div class="card"><h3>Куда ушли машины ('+short(day)+')</h3>'+objBars(day)+'</div></div>';

  h+='<div class="card" style="margin-top:16px"><h3>Факт вывоза по объектам ('+short(day)+')</h3>'+factTable(day)+'</div>';

function factTable(day){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){
    if(!it.fact)return;var t=factTotals(it);var k=r.object;
    var x=m[k]||(m[k]={name:objShort(k),own:0,hired:0,trips:0,km:0});
    x.own+=t.own;x.hired+=t.hired;x.trips+=t.trips;x.km+=t.km;
  })});
  var rows=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return (b.own+b.hired)-(a.own+a.hired)});
  if(!rows.length)return '<div class="empty">Факт за этот день ещё не внесён диспетчерами.</div>';
  var T={own:0,hired:0,trips:0,km:0};
  var body=rows.map(function(x){T.own+=x.own;T.hired+=x.hired;T.trips+=x.trips;T.km+=x.km;return '<tr><td>'+esc(x.name)+'</td><td class="num">'+r1(x.own)+'</td><td class="num">'+r1(x.hired)+'</td><td class="num"><b>'+r1(x.own+x.hired)+'</b></td><td class="num">'+x.trips+'</td><td class="num">'+Math.round(x.km)+'</td></tr>'}).join('');
  body+='<tr><td><b>Итого</b></td><td class="num"><b>'+r1(T.own)+'</b></td><td class="num"><b>'+r1(T.hired)+'</b></td><td class="num"><b>'+r1(T.own+T.hired)+'</b></td><td class="num"><b>'+T.trips+'</b></td><td class="num"><b>'+Math.round(T.km)+'</b></td></tr>';
  return '<div class="table"><table><thead><tr><th>Объект</th><th>Рено, м³</th><th>Перевозчики, м³</th><th>Всего, м³</th><th>Рейсов Рено</th><th>Пробег, км</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function trendHtml(ds,sel){
  var data=ds.map(function(k){var s=dayStats(k);return {k:k,own:s.own,hired:s.hired,gap:Math.max(0,s.need-s.own-s.hired)}});
  var max=Math.max.apply(null,data.map(function(x){return x.own+x.hired+x.gap}).concat([1]));
  return '<div class="trend">'+data.map(function(x){
    var tot=x.own+x.hired+x.gap;
    return '<div class="col" title="'+short(x.k)+': свои '+x.own+', наёмные '+x.hired+', не закрыто '+x.gap+'"><span class="num" style="color:var(--fg)">'+(tot||'')+'</span><div class="stack"><i class="c-need" style="height:'+(x.gap/max*100)+'%"></i><i class="c-hire" style="height:'+(x.hired/max*100)+'%"></i><i class="c-own" style="height:'+(x.own/max*100)+'%"></i></div><span style="'+(x.k===sel?'color:var(--fg);font-weight:600':'')+'">'+short(x.k).slice(0,5)+'</span></div>';
  }).join('')+'</div>';
}
function barsHtml(rows,unit){
  if(!rows.length)return '<div class="empty">За этот день данных нет.</div>';
  var max=Math.max.apply(null,rows.map(function(r){return r.own+r.hired}).concat([1]));
  return '<div class="bars">'+rows.map(function(r){return '<div class="b"><span class="n">'+esc(r.name)+'</span><div class="t"><i class="c-own" style="width:'+(r.own/max*100)+'%"></i><i class="c-hire" style="width:'+(r.hired/max*100)+'%"></i></div><span class="num">'+(r.own+r.hired)+'</span></div>'}).join('')+'</div>';
}
function objBars(day){
  var m={};
  dayRequests(day).forEach(function(r){var k=objShort(r.object);m[k]=m[k]||{name:k,own:0,hired:0};(r.items||[]).forEach(function(it){var a=it.assigned||{};m[k].own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){m[k].hired+=(+h.count||0)})})});
  var rows=Object.keys(m).map(function(k){return m[k]}).filter(function(x){return x.own+x.hired>0}).sort(function(a,b){return b.own+b.hired-a.own-a.hired});
  return barsHtml(rows);
}
function carrierBars(day){
  var m={},f={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){var a=it.assigned||{};
    (a.hired||[]).forEach(function(h){m[h.carrier]=(m[h.carrier]||0)+(+h.count||0)});
    if(a.agreed&&a.agreed!=='перенос из Excel')m[a.agreed]=(m[a.agreed]||0)+(+it.count||0);
    if(it.fact)(it.fact.hired||[]).forEach(function(h){var n=h.carrier||'без перевозчика (экология, бесплатный вывоз, реализация)';f[n]=(f[n]||0)+num(h.vol)})})});
  var rows=Object.keys(m).map(function(k){return {name:k,own:0,hired:m[k]}}).sort(function(a,b){return b.hired-a.hired});
  var frows=Object.keys(f).map(function(k){return {name:k,own:0,hired:Math.round(f[k])}}).sort(function(a,b){return b.hired-a.hired});
  var h='';
  if(rows.length)h+='<div class="small muted" style="margin-bottom:4px">заказано машин</div>'+barsHtml(rows);
  if(frows.length)h+='<div class="small muted" style="margin:'+(rows.length?'12px':'0')+' 0 4px">вывезено по факту, м³</div>'+barsHtml(frows);
  return h||barsHtml([]);
}
function materialBars(day){
  var m={};
  dayRequests(day).forEach(function(r){(r.items||[]).forEach(function(it){if(it.type==='polivo')return;var k=it.material||'—';m[k]=m[k]||{name:k,own:0,hired:0};var a=it.assigned||{};m[k].own+=(a.own||[]).length;(a.hired||[]).forEach(function(h){m[k].hired+=(+h.count||0)})})});
  var rows=Object.keys(m).map(function(k){return m[k]}).filter(function(x){return x.own+x.hired>0}).sort(function(a,b){return b.own+b.hired-a.own-a.hired});
  return barsHtml(rows);
}
function fleetTable(day){
  if(!S.fleet.length)return '<div class="empty">Парк не заполнен.</div>';
  var used=usedBy(day);
  var rows=sortBy(S.fleet,function(v){return v.order||0}).map(function(v){
    var u=used[v.id];var s=v.status==='repair'?'<span class="pill bad">ремонт</span>':u?'<span class="pill ok">в работе</span>':'<span class="pill" style="background:var(--soft);color:var(--muted)">свободна</span>';
    var hist=0;for(var i=-6;i<=0;i++){if(usedBy(dkey(addDays(new Date(),i)))[v.id])hist++}

function perBounds(kind,off){
  var t=new Date(),a,b;
  if(kind==='week'){var d=addDays(t,off*7),w=(d.getDay()+6)%7;a=addDays(d,-w);b=addDays(a,6)}
  else if(kind==='month'){a=new Date(t.getFullYear(),t.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}
  else if(kind==='quarter'){var q=Math.floor(t.getMonth()/3)+off;a=new Date(t.getFullYear(),q*3,1);b=new Date(a.getFullYear(),a.getMonth()+3,0)}
  else if(kind==='year'){a=new Date(t.getFullYear()+off,0,1);b=new Date(t.getFullYear()+off,11,31)}
  return {from:dkey(a),to:dkey(b)};
}
function perLabel(kind,r){
  var a=parseKey(r.from),b=parseKey(r.to);
  if(kind==='week')return ruDate(r.from).slice(0,5)+' — '+ruDate(r.to).slice(0,5)+'.'+r.to.slice(0,4);
  if(kind==='month')return MONTHS[a.getMonth()][0].toUpperCase()+MONTHS[a.getMonth()].slice(1)+' '+a.getFullYear();
  if(kind==='quarter')return (Math.floor(a.getMonth()/3)+1)+' квартал '+a.getFullYear();

function perRange(){
  var kind=st.pk||'month',off=st.pOff||0,t=today(),r,prev=null,partial=false;

    var n=dayDiff(r.from,r.to)+1;prev={from:dkey(addDays(parseKey(r.from),-n)),to:dkey(addDays(parseKey(r.from),-1))};

}

function appendImport(){
  var h='<div class="card" style="margin-top:16px"><h3>Перенос данных из Excel</h3><div class="small muted" style="margin-bottom:8px">Выберите файл переноса (import.json). Загрузка безопасна: если запустить повторно, записи не задвоятся.</div><input type="file" id="impFile" accept=".json,application/json"> <button class="btn" data-act="impGo">Загрузить</button><div id="impLog" class="small" style="margin-top8px;margin-top:8px"></div></div>';
  $('#main').insertAdjacentHTML('beforeend',h);
}
function impLog(t){var e=$('#impLog');if(e)e.textContent=t}
function runImport(){
  var f=$('#impFile')&&$('#impFile').files[0];if(!f){toast('Сначала выберите файл');return}
  var rd=new FileReader();
  rd.onload=function(){
    var J;try{J=JSON.parse(rd.result)}catch(e){impLog('Файл не читается');return}
    var docs=[];
    (J.objects||[]).forEach(function(o){if(!byId(S.objects,o.id))docs.push({coll:'objects',id:o.id,data:o})});
    (J.carriers||[]).forEach(function(n){var id=slug(n);if(!S.carriers.some(function(c){return c.name===n}))docs.push({coll:'carriers',id:id,data:{name:n}})});
    (J.staff||[]).forEach(function(s){if(!byId(S.staff,s.id))docs.push({coll:'staff',id:s.id,data:s})});
    (J.requests||[]).forEach(function(r){docs.push({coll:'requests',id:r.id,data:r})});
    (J.payments||[]).forEach(function(p){docs.push({coll:'payments',id:p.id,data:p})});
    var total=docs.length,done=0,CH=20;
    impLog('Загружаю: 0 из '+total+'…');
    function next(){
      if(done>=total){impLog('Готово: загружено '+total+'. Откройте вкладку «Сводка».');toast('Загружено записей: '+total);return}
      var part=docs.slice(done,done+CH);
      api({op:'imp',docs:part}).then(function(r){
        if(!r||!r.ok){impLog('Ошибка: '+((r&&r.error)||'нет связи')+'. Загружено '+done+' из '+total+'. Нажмите «Загрузить» ещё раз.');return}
        done+=part.length;impLog('Загружаю: '+done+' из '+total+'…');next();
      },function(e){impLog('Нет связи. Загружено '+done+' из '+total+'. Нажмите «Загрузить» ещё раз.')});
    }
    next();
  };
  rd.readAsText(f);
}

    ks=sortF?ks.sort(sortF):ks.sort(function(a,b){return map[b].vol-map[a].vol});
    return '<div class="card" style="margin-top:12px"><h3>'+title+'</h3><div style="overflow-x:auto"><table class="tb" style="width:100%"><tr><th style="text-align:left">'+first+'</th><th style="text-align:right">Машин</th><th style="text-align:right">м³</th></tr>'
     +ks.map(function(k){var l=first==='Дата'?ruDate(k):first==='Объект'?objShort(k):k;return '<tr><td style="text-align:left">'+esc(l)+'</td><td style="text-align:right">'+fmt(map[k].cars)+'</td><td style="text-align:right">'+fmt(map[k].vol,1)+'</td></tr>'}).join('')+'</table></div></div>';
  }
  var h='<div class="intro"><b>Итоги вывоза по вашим объектам.</b> Данные вносит диспетчер по факту смены. Стоимость не показывается.</div>';
  h+='<div class="chips" style="margin:10px 0">'+TKINDS.map(function(x){return '<button class="chip" data-act="tkind" data-v="'+x[0]+'" aria-pressed="'+((st.tk||'month')===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="daynav"><button class="btn sm" data-act="tshift" data-v="-1" aria-label="Назад">◀</button><b style="min-width:170px;text-align:center">'+esc(R.label)+'</b><button class="btn sm" data-act="tshift" data-v="1" aria-label="Вперёд">▶</button></div>';
  if(!objIds.length)return void(el.innerHTML='<div class="sv">'+h+'<div class="empty">За вами пока не закреплены объекты. Обратитесь к администратору.</div></div>');
  h+='<div class="tiles">'+tile('Вывезено',fmt(T.vol,1),'м³','',{hero:true})+tile('Машин',fmt(T.cars),'','за период')+tile('Объектов',String(objIds.length),'','закреплено за вами')+'</div>';
  if(!T.cars&&!T.vol)h+='<div class="empty" style="margin-top:12px">За этот период вывоза по фактам нет.</div>';
  h+=tbl('По объектам',T.obj,'Объект')+tbl('Материал',T.mat,'Материал')+tbl('Перевозчики',T.car,'Перевозчик')+tbl('Полигоны',T.dest,'Полигон')
    +(R.kind==='day'?'':tbl('По дням (машин и объём)',T.day,'Дата',function(a,b){return a<b?1:-1}));
  el.innerHTML='<div class="sv">'+h+'</div>';
}
function renderMainOnly(){var t=st.tab;if(t==='dispatcher')renderDispatcher();else if(t==='director')renderDirector();else if(t==='svodka')renderSvodka();else if(t==='debts')renderDebts();else if(t==='salary')renderSalary();else if(t==='econ')renderEcon();else if(t==='plan')renderPlan();else if(t==='adv')renderAdv();else if(t==='qa')renderQA();else if(t==='totals')renderTotals();else if(t==='admin')renderAdmin()}
function renderLogin(r){
  $('#tabs').innerHTML='';$('#who').textContent='';
  $('#main').innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><h3>Вход для руководителя проекта</h3><div class="small muted" style="margin-bottom:10px">'+esc(r.name||'')+'</div>'
   +(r.tried?'<div class="small" style="color:var(--bad);margin-bottom:8px">Пароль не подошёл. Проверьте и введите ещё раз.</div>':'')
   +'<label class="f" for="lgp">Пароль</label><input type="password" id="lgp" style="width:100%" autocomplete="current-password">'
   +'<button class="btn pri" style="width:100%;margin-top:12px;padding:12px" data-act="login">Войти</button><div class="small muted" style="margin-top:8px">Пароль выдаёт администратор.</div></div>';
}
function doLogin(){
  var p=($('#lgp')||{}).value||'';if(!p)return;
  PASS=p;try{localStorage.setItem('zvp:'+TOKEN,p)}catch(e){}
  refresh(true);
}
function refresh(force){
  if(inflight>0&&!force)return;
  api({op:'boot',v:force?null:VER}).then(function(r){
    if(!r.ok&&r.error==='pass'){ME=null;renderLogin(r);return}
    if(!r.ok){
      $('#main').innerHTML='<div class="empty">'+(r.error==='auth'?'Эта ссылка не действует. Попросите у администратора личную ссылку.':'Ошибка: '+esc(r.error))+'</div>';ME=null;return;
    }
    if(r.same||inflight>0)return;
    VER=r.ver;ME=r.me;
    if(ME.kind==='foreman'){ME.ref=byId(r.data.foremen,ME.id)}
    for(var k in r.data)S[k]=r.data[k];
    afterData();
  }).catch(function(){
    if(!ME)$('#main').innerHTML='<div class="empty">Нет связи с сервером. Обновите страницу.</div>';
  });
}
(function init(){
  if(!TOKEN){$('#main').innerHTML='<div class="empty">Откройте систему по своей личной ссылке.</div>';return}
  if(!window.ZV_URL||window.ZV_URL.indexOf('http')!==0){$('#main').innerHTML='<div class="empty">Система ещё не подключена к серверу.</div>';return}
  $('#main').innerHTML='<div class="empty">Загружаю…</div>';
  refresh(true);
  setInterval(function(){if(document.visibilityState==='visible')refresh(false)},12000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh(false)});
})();
})();
</script>
</body></html>
