<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E671F">
<meta name="robots" content="noindex">
<title>Руководитель — ГК «КРАШМАШ»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}

/* Layout: одна колонка под большой палец; липкая шапка с вкладками; поля крупные, цифры моноширинные */
:root{
  --brand:#2E671F;
  --bg:#eef1ec; --surface:#ffffff; --sunk:#e2e8df; --line:#cbd4c7;
  --fg:#18221a; --muted:#5a6758; --accent:#2E671F; --accent-ink:#ffffff;
  --steel:#2E671F; --ok:#2E671F; --warn:#b26b00; --bad:#b3362c;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#1a211b; --sunk:#232c24; --line:#344035;
  --fg:#e6ede5; --muted:#9aa898; --accent:#5f9e4b; --accent-ink:#0c1709;
  --steel:#8cc47a; --ok:#7fc06a; --warn:#e3a33c; --bad:#ec6a5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1a211b; --sunk:#232c24; --line:#344035;
  --fg:#e6ede5; --muted:#9aa898; --accent:#5f9e4b; --accent-ink:#0c1709;
  --steel:#8cc47a; --ok:#7fc06a; --warn:#e3a33c; --bad:#ec6a5e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.35}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;margin-inline:-16px;padding:10px 16px 0}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brandrow img{height:48px;width:auto;flex:0 0 auto;display:block}
.brandrow .ttl{min-width:0}
.obj{font-size:16px;font-weight:600;line-height:1.3}
h1{font-size:20px;margin:2px 0 8px;font-weight:700;text-wrap:balance}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;border:0;background:transparent;color:inherit;font:600 15px var(--f-ui);padding:10px 4px 12px;border-bottom:3px solid transparent;opacity:.75;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:#fff}
.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--sunk);border-left:4px solid var(--warn);font-size:14px}
.banner.bad{border-left-color:var(--bad)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;padding:14px}
section.card h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.code{font-family:var(--f-num);font-size:12px;color:var(--steel);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:16px var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 10px;width:100%;min-height:44px}
input[inputmode]{font-family:var(--f-num);text-align:right}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--fg);font:600 15px var(--f-ui);min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.work{display:grid;grid-template-columns:1fr 112px;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.work:first-of-type{border-top:0}
.work .nm{min-width:0}
.work .nm b{display:block;font-weight:500}
.work .nm small{color:var(--muted);font-size:12px;line-height:1.5}
.work .nm small b.pt{display:inline;font-family:var(--f-num);font-weight:600;color:var(--fg)}
.mach{display:grid;grid-template-columns:1fr 84px 44px;gap:8px;align-items:center;padding:6px 0}
.haul{display:grid;grid-template-columns:1fr 64px 84px 44px;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.haul:first-child{border-top:0}
.haul .cr{grid-column:1/4}
.haul .del{min-width:44px;padding:0;font-size:20px;line-height:1}
.haul-hd{display:grid;grid-template-columns:1fr 64px 84px 44px;gap:8px;font-size:12px;color:var(--muted)}
.haul-hd span:nth-child(2),.haul-hd span:nth-child(3){text-align:right}
.mach .del{min-width:44px;padding:0;font-size:20px;line-height:1}
.mach-hd{display:grid;grid-template-columns:1fr 84px 44px;gap:8px;font-size:12px;color:var(--muted)}
.mach-hd span:nth-child(2){text-align:right}
.dt{display:grid;grid-template-columns:1fr 78px;gap:6px 8px;padding:10px 0;border-top:1px dashed var(--line)}
.dt .full{grid-column:1/-1}
.dtk{display:flex;gap:6px}.dtk button{flex:1;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);color:inherit;font-size:14px}
.dtk button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--f-ui);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
.btn.small{min-height:36px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;font-size:13px;color:var(--muted);min-width:0}
.savebar .btn{flex:0 0 auto;min-width:150px}
td.muted{color:var(--muted);padding-left:14px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
.ot{display:flex;gap:8px}
.ot button{flex:1}
.ot button[aria-pressed="true"].no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ot button[aria-pressed="true"].yes{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-family:var(--f-num);font-size:20px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 8px;border-radius:999px;background:var(--sunk)}
.chip.miss{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.log{display:flex;flex-direction:column;gap:8px}
.log button.item{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 12px;cursor:pointer;font:15px var(--f-ui);display:flex;flex-direction:column;gap:4px}
.log .meta{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.log .sum{color:var(--muted);font-size:13px}
.flag{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--bad);color:var(--surface);font-weight:600}
.sendgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.btn.send,button.btn.send{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px;font-size:16px}
a.btn.send.max{background:#4b2bd6;border-color:#4b2bd6;color:#fff}
a.btn.send.tg{background:#229ed9;border-color:#229ed9;color:#fff}
a.btn.send.wa{background:#1fa855;border-color:#1fa855;color:#fff}
pre.gp{white-space:pre-wrap;font:13px/1.45 var(--f-num);background:var(--sunk);border-radius:8px;padding:12px;margin:10px 0 0;max-height:420px;overflow:auto}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

.dnav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.dnav .btn{min-height:44px;padding:0;font-size:20px}
#v-sum .dg{background:#fff;border-radius:10px;overflow:hidden;color:#1d1d1b}
.ob{padding:12px 0;border-top:1px solid var(--line)}
.ob:first-child{border-top:0}
.ob-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ob-h b{font-weight:600;line-height:1.3}
.ob-s{font-size:12px;color:var(--muted);margin-top:2px}
.st{flex:none;font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk)}
.st.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--ok)}
.st.no{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.pw{padding:7px 0;border-top:1px dashed var(--line)}
.pw:first-child{border-top:0}
.pw .pn{font-size:14px}
.pw .pn small{display:block;color:var(--muted);font-size:11px}
.pw .pv{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);margin-top:2px}
.pw .pv b{font-family:var(--f-num);font-weight:600;color:var(--fg)}
.pw .pv b.bad{color:var(--bad)}
.pw .bar{margin-top:4px}
.top3{margin-top:6px}
.more{margin-top:8px}
.feed{padding:12px 0;border-top:1px solid var(--line)}
.feed:first-child{border-top:0}
.feed .fh{font-weight:600;line-height:1.3}
.feed .fm{font-size:12px;color:var(--muted);margin:2px 0 0}
.feed .new{display:inline-block;font-size:11px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.feed .gp{max-height:none}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.tabs .cnt{display:inline-block;min-width:18px;font-size:11px;background:#fff;color:var(--accent);border-radius:9px;padding:0 5px;margin-left:4px}
</style>
</head>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-sum" aria-selected="true" data-v="sum">Сводка</button>
      <button role="tab" id="tab-obj" aria-selected="false" data-v="obj">Объекты</button>

  </header>
  <div id="status" class="banner" hidden></div>
  <section class="card">
    <div class="dnav">
      <button type="button" class="btn" id="d-prev" aria-label="Предыдущий день">‹</button>
      <input type="date" id="d-date" aria-label="Дата">
      <button type="button" class="btn" id="d-next" aria-label="Следующий день">›</button>

  </section>

  <div id="v-sum">
    <section class="card"><div class="dg" id="sum-out"><div class="empty">Загрузка…</div></div>
      <button type="button" class="btn small" id="d-copy" style="margin-top:10px">Скопировать текст сводки</button></section>
  </div>
  <div id="v-obj" hidden>
    <section class="card"><h2>Объекты <span id="obj-cnt"></span></h2><div id="obj-out"></div></section>
  </div>
  <div id="v-feed" hidden>
    <section class="card"><h2>Рапорты <span>за 3 дня до выбранной даты</span></h2><div id="feed-out"></div></section>
  </div>
  <div class="foot">Данные из базы рапортов. Пока страница открыта, она обновляется каждые 5 минут.</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const sget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const sset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const ru=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"";
const fmt=(v,d)=>{if(v===null||v===undefined||v===""||isNaN(v))return "—";return Number(v).toLocaleString("ru-RU",{maximumFractionDigits:d===undefined?2:d});};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const h=new URLSearchParams(location.hash.slice(1));
let db=null;
if(h.get("u")&&h.get("k")){db={u:h.get("u"),k:h.get("k")};sset("raport2-director",JSON.stringify(db));}
else{try{db=JSON.parse(sget("raport2-director")||"null");}catch(e){}}
// адрес с ключом остаётся в строке: iPhone «На экран Домой» сохраняет текущий адрес, а у значка своё хранилище
if(db&&!(h.get("u")&&h.get("k"))){try{history.replaceState(null,"",location.pathname+"#u="+encodeURIComponent(db.u)+"&k="+encodeURIComponent(db.k));}catch(e){}}
let D=null,view=sget("raport2-dtab")||"sum",open={};
function status(t,cls){const s=$("status");s.hidden=!t;s.className="banner"+(cls?" "+cls:"");s.textContent=t||"";}
function show(v){view=v;["sum","obj","feed"].forEach(x=>{$("v-"+x).hidden=x!==v;$("tab-"+x).setAttribute("aria-selected",String(x===v));});sset("raport2-dtab",v);if(v==="feed")markSeen();}
const lastSeen=()=>sget("raport2-dseen")||"";
function newCount(){if(!D)return 0;const s=lastSeen();return D.feed.filter(f=>f.savedAt&&f.savedAt>s).length;}
function markSeen(){if(!D)return;const mx=D.feed.reduce((a,f)=>f.savedAt>a?f.savedAt:a,lastSeen());setTimeout(()=>{sset("raport2-dseen",mx);paintCnt();},4000);}
function paintCnt(){const n=newCount(),c=$("new-cnt");c.hidden=!n;c.textContent=n;}
async function load(quiet){
  if(!db){status("Откройте приложение по ссылке руководителя (в ней адрес базы).","bad");return;}
  const date=$("d-date").value||todayISO();
  if(!quiet){$("sum-out").innerHTML='<div class="empty" style="padding:10px">Загрузка…</div>';}
  try{const u=db.u+(db.u.includes("?")?"&":"?")+new URLSearchParams({k:db.k,a:"dash",date:date,days:3});
    const r=await fetch(u,{redirect:"follow"});const j=await r.json();
    if(!j.ok)throw new Error(j.error==="action"?"обновите скрипт базы (новая версия развертывания)":j.error==="key"?"неверный ключ":(j.error||"ошибка"));
    D=j;status("");render();
    $("upd").textContent="Обновлено в "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+" · рапортов за "+ru(date)+": "+j.digest.ok+" из "+j.digest.total;}
  catch(e){status("Не удалось загрузить: "+(e.message||"нет связи"),"bad");}
}
function pw(w){
  const e=el("div","pw");const pn=el("div","pn");const c=el("span","code",w.c);pn.appendChild(c);pn.appendChild(document.createTextNode(" "+w.n+", "+w.u));
  if(w.ro)pn.appendChild(el("small",null,"справочно"));else if(w.auto)pn.appendChild(el("small",null,"считается автоматически"));
  e.appendChild(pn);const pv=el("div","pv");
  const add=(l,v,bad)=>{const s=el("span",null,l+" ");const b=el("b",bad?"bad":null,v);s.appendChild(b);pv.appendChild(s);};
  add("план",w.t?fmt(w.t):"не задан");add("выполнено",fmt(w.done),w.t&&w.done>w.t);if(w.t){add("остаток",fmt(Math.max(0,w.t-w.done)));add("",fmt(w.done/w.t*100,1)+"%");}
  e.appendChild(pv);if(w.t){const bar=el("div","bar");const i=el("i");i.style.width=Math.min(100,w.done/w.t*100)+"%";bar.appendChild(i);e.appendChild(bar);}
  return e;}
function render(){
  $("sum-out").innerHTML=D.digest.html.replace(/КРАШ МАШ/g,"КРАШМАШ");
  // объекты
  const oo=$("obj-out");oo.innerHTML="";const act=D.objects.filter(o=>o.active),rest=D.objects.filter(o=>!o.active);
  $("obj-cnt").textContent="в работе: "+act.length;
  const draw=o=>{const b=el("div","ob");const hd=el("div","ob-h");const t=el("div");t.appendChild(el("b",null,o.name));
    t.appendChild(el("div","ob-s",o.last?"последний рапорт: "+ru(o.last.date)+", "+(o.last.shift==="N"?"ночь":"день")+(o.last.foreman?" — "+o.last.foreman:""):"рапортов пока нет"));hd.appendChild(t);
    hd.appendChild(el("span","st "+(o.today?"ok":(o.active?"no":"")),o.today?"рапорт есть":(o.active?"нет рапорта":"нет данных")));b.appendChild(hd);
    const planned=o.works.filter(w=>w.t&&!w.ro).sort((a,b2)=>(b2.done/b2.t)-(a.done/a.t));
    const top=el("div","top3");planned.filter(w=>w.done<w.t).slice(0,3).forEach(w=>top.appendChild(pw(w)));if(top.children.length)b.appendChild(top);
    const full=el("div");full.hidden=!open[o.pid];
    (o.info||[]).forEach(s=>full.appendChild(el("div","ob-s",s)));
    o.works.forEach(w=>full.appendChild(pw(w)));
    if(o.extra.length){full.appendChild(el("div","grp","Вне бюджета"));o.extra.forEach(x=>full.appendChild(pw({c:"",n:x.n,u:x.u,t:0,done:x.v})));}
    b.appendChild(full);
    const btn=el("button","btn small more",open[o.pid]?"Свернуть паспорт":"Весь паспорт объекта");btn.type="button";
    btn.onclick=()=>{open[o.pid]=!open[o.pid];full.hidden=!open[o.pid];btn.textContent=open[o.pid]?"Свернуть паспорт":"Весь паспорт объекта";};
    b.appendChild(btn);oo.appendChild(b);};
  act.forEach(draw);
  if(rest.length){oo.appendChild(el("div","grp","Без рапортов за 7 дней"));rest.forEach(draw);}
  if(!D.objects.length)oo.appendChild(el("div","empty","Объекты появятся с первыми рапортами прорабов."));
  // лента
  const fo=$("feed-out");fo.innerHTML="";const s=lastSeen();
  if(!D.feed.length)fo.appendChild(el("div","empty","Рапортов за эти дни нет."));
  D.feed.forEach(f=>{const b=el("div","feed");const t=el("div","fh",f.name);if(f.savedAt&&f.savedAt>s)t.appendChild(el("span","new","новый"));b.appendChild(t);
    b.appendChild(el("div","fm",ru(f.date)+" · "+(f.shift==="N"?"ночная":"дневная")+" смена · "+f.foreman+(f.savedAt?" · сдан "+new Date(f.savedAt).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"")));
    b.appendChild(el("pre","gp",f.text));fo.appendChild(b);});
  paintCnt();if(view==="feed")markSeen();
}
const shiftD=n=>{const d=new Date(($("d-date").value||todayISO())+"T12:00:00");d.setDate(d.getDate()+n);$("d-date").value=d.toISOString().slice(0,10);load();};
$("d-date").value=todayISO();
$("d-date").addEventListener("change",()=>load());$("d-prev").onclick=()=>shiftD(-1);$("d-next").onclick=()=>shiftD(1);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("d-copy").onclick=()=>{if(!D)return;const done=ok=>status(ok?"Текст скопирован":"Не удалось скопировать",ok?"okb":"bad");try{navigator.clipboard.writeText(D.digest.text).then(()=>done(true),()=>done(false));}catch(e){done(false);}};
setInterval(()=>{if(!document.hidden)load(true);},300000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&D)load(true);});
show(["sum","obj","feed"].includes(view)?view:"sum");load();
})();
</script>
</body>
